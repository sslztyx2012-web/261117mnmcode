<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DEAD DAWN · 死者黎明</title>
<style>
:root{
  --amber:#ffb45a; --amber2:#ff8c2e; --red:#ff4d4d; --green:#8fe08a; --cyan:#79d8ff;
  --txt:#e8eef6; --dim:#8d9cb0; --line:rgba(255,255,255,.10);
  --panel:rgba(8,11,16,.90);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04060a;color:var(--txt);
 font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
 user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;cursor:default}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
body.playing canvas#c{cursor:none}
.num{font-family:"Bahnschrift","DIN Alternate","Consolas",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- overlays ---------- */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
 background:radial-gradient(ellipse 78% 68% at 50% 48%,rgba(0,0,0,0) 42%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.80) 100%)}
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:6;opacity:.030;mix-blend-mode:overlay;
 filter:grayscale(1) contrast(140%);
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
 animation:grain .7s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-2%,1.5%)}66%{transform:translate(1.5%,-2%)}100%{transform:translate(0,0)}}
#damage{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .35s;
 background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(120,0,0,0) 40%,rgba(150,0,0,.55) 85%,rgba(90,0,0,.85) 100%)}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;
 background:radial-gradient(ellipse 75% 65% at 50% 50%,rgba(120,0,0,0) 45%,rgba(120,0,0,.42) 100%);
 animation:pulse 1.15s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.75}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
#crosshair{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
#crosshair i{position:absolute;background:rgba(238,246,255,.88);box-shadow:0 0 4px rgba(0,0,0,.9)}
#crosshair i.t{left:50%;top:0;width:2px;height:9px;margin-left:-1px}
#crosshair i.b{left:50%;bottom:0;width:2px;height:9px;margin-left:-1px}
#crosshair i.l{top:50%;left:0;height:2px;width:9px;margin-top:-1px}
#crosshair i.r{top:50%;right:0;height:2px;width:9px;margin-top:-1px}
#crosshair i.dot{left:50%;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;background:rgba(255,190,110,.95)}
/* --- ADS optic picture (scope / reflex overlay) --- */
#scope{position:absolute;inset:0;opacity:0;pointer-events:none}
#scope.on{opacity:1}
#scope .vig{position:absolute;inset:0;
 background:radial-gradient(ellipse 58% 70% at 50% 50%,rgba(0,0,0,0) 34%,rgba(2,5,8,.42) 60%,rgba(1,2,4,.93) 86%)}
#scope .lens{position:absolute;left:50%;top:50%;width:min(88vh,88vw);height:min(88vh,88vw);
 transform:translate(-50%,-50%);border-radius:50%;
 border:1px solid rgba(150,175,190,.10);
 box-shadow:inset 0 0 90px rgba(0,0,0,.8),0 0 70px rgba(0,0,0,.55);
 background:radial-gradient(circle at 50% 42%,rgba(110,170,190,.055),rgba(18,40,52,.03) 58%,rgba(0,0,0,.22))}
#scope .ret{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;height:260px}
#scope .ret i{position:absolute;background:rgba(216,232,224,.30);box-shadow:0 0 2px rgba(0,0,0,.95)}
#scope .ret .h{left:0;right:0;top:50%;height:1px}
#scope .ret .v{top:0;bottom:0;left:50%;width:1px}
#scope .ret .tk{left:50%;width:1px;height:7px;background:rgba(216,232,224,.20)}
#scope .ret .dot{left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
 background:#ff3a1f;box-shadow:0 0 10px rgba(255,58,31,1),0 0 2px rgba(255,220,210,.9)}

#hitmark{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) scale(.7);opacity:0}
#hitmark i{position:absolute;width:10px;height:2px;background:#fff;box-shadow:0 0 6px #fff}
#hitmark i:nth-child(1){top:6px;left:4px;transform:rotate(45deg)}
#hitmark i:nth-child(2){top:6px;right:4px;transform:rotate(-45deg)}
#hitmark i:nth-child(3){bottom:6px;left:4px;transform:rotate(-45deg)}
#hitmark i:nth-child(4){bottom:6px;right:4px;transform:rotate(45deg)}
#hitmark.show{animation:hm .28s ease-out}
@keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) scale(.55)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}

#vitals{position:absolute;left:34px;bottom:30px;width:250px}
.vlab{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--dim);margin-bottom:6px}
.vlab b{color:var(--txt);font-weight:600}
.bar{position:relative;height:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);
 overflow:hidden;backdrop-filter:blur(3px)}
.bar>i{position:absolute;inset:0;right:auto;width:100%;transition:width .18s linear;
 background:linear-gradient(90deg,#7d1414,#e03a3a 60%,#ff6b5b)}
.bar>i.sp{background:linear-gradient(90deg,#5c6b1e,#b8d43a)}
.bar>span{position:absolute;right:5px;top:0;line-height:13px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.bar.sm{height:6px;margin-top:5px}
#scrapRow{margin-top:9px;font-size:12px;color:var(--amber);letter-spacing:.08em;display:flex;gap:6px;align-items:center}
#scrapRow .sq{width:9px;height:9px;background:var(--amber);transform:rotate(45deg);box-shadow:0 0 8px rgba(255,180,90,.8)}

#ammoBox{position:absolute;right:34px;bottom:30px;text-align:right}
#wepName{font-size:12px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
#ammoLine{font-size:52px;line-height:1.05;font-weight:600;text-shadow:0 3px 14px rgba(0,0,0,.9)}
#ammoLine .sep{font-size:24px;color:var(--dim);margin:0 4px}
#ammoLine .res{font-size:26px;color:var(--dim)}
#wepSlots{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
.wepSlot{font-size:11px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line);padding:3px 9px;background:rgba(0,0,0,.35)}
.wepSlot.on{color:#0b0d10;background:var(--amber);border-color:var(--amber);font-weight:700}
#reloadRing{display:none;position:absolute;right:34px;bottom:118px;width:54px;height:54px}

#topbar{position:absolute;top:24px;left:50%;transform:translateX(-50%);text-align:center;min-width:300px}
#waveLabel{font-size:13px;letter-spacing:.34em;color:var(--amber);text-transform:uppercase;
 text-shadow:0 0 18px rgba(255,140,46,.55)}
#waveSub{font-size:11px;letter-spacing:.18em;color:var(--dim);margin-top:4px}
#banner{position:absolute;top:24%;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .4s}
#banner.show{opacity:1}
#banner .b1{font-size:40px;font-weight:700;letter-spacing:.12em;color:#fff;text-shadow:0 0 30px rgba(255,120,40,.75),0 6px 22px #000}
#banner .b2{font-size:13px;letter-spacing:.42em;color:var(--amber);margin-top:8px}

#radarWrap{position:absolute;right:34px;top:24px;width:168px;height:168px}
#radar{width:100%;height:100%;border-radius:50%;background:rgba(4,8,12,.55);
 border:1px solid rgba(255,255,255,.13);box-shadow:0 6px 26px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.7)}
#radarN{position:absolute;top:-3px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;color:var(--amber)}

#toasts{position:absolute;left:34px;top:24px;width:330px;display:flex;flex-direction:column;gap:6px}
.toast{font-size:12.5px;letter-spacing:.05em;color:var(--txt);background:rgba(6,9,13,.62);
 border-left:2px solid var(--amber);padding:5px 11px;backdrop-filter:blur(4px);
 animation:tin .25s ease-out}
.toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

#prompt{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);font-size:14px;letter-spacing:.06em;
 padding:7px 16px;background:rgba(6,9,13,.66);border:1px solid var(--line);display:none;
 backdrop-filter:blur(4px);white-space:nowrap}
#prompt.on{display:block}
#prompt kbd{display:inline-block;background:var(--amber);color:#0a0c10;font-weight:700;border-radius:3px;
 padding:1px 7px;margin-right:8px;font-family:inherit;font-size:12px}
#debug{position:absolute;left:34px;top:50%;transform:translateY(-50%);font-size:11px;line-height:1.6;
 color:#9fe0b0;text-shadow:0 1px 3px #000;display:none;white-space:pre;font-family:"Consolas",monospace}
#debug.on{display:block}

#dmgdirs{position:absolute;left:50%;top:50%;width:0;height:0}
.ddir{position:absolute;left:-24px;top:-150px;width:48px;height:16px;
 background:radial-gradient(ellipse at 50% 100%,rgba(255,60,60,.85),rgba(255,60,60,0) 72%);opacity:0}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 40%,rgba(12,18,26,.86),rgba(2,3,5,.96));
 backdrop-filter:blur(9px)}
.screen.on{display:flex}
.panel{width:min(600px,92vw);background:var(--panel);border:1px solid var(--line);
 box-shadow:0 30px 90px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);padding:34px 38px}
.pnl-sm{width:min(430px,92vw)}
h1.logo{font-size:52px;font-weight:800;letter-spacing:.1em;line-height:1;
 background:linear-gradient(180deg,#fff 10%,#ffb45a 62%,#a8480f 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 26px rgba(255,120,40,.35))}
.sub{margin-top:10px;font-size:12.5px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0}
.btn{display:block;width:100%;margin-top:11px;padding:13px 18px;background:rgba(255,255,255,.045);
 border:1px solid var(--line);color:var(--txt);font-size:14px;letter-spacing:.16em;cursor:pointer;
 font-family:inherit;text-align:left;transition:.16s;position:relative;text-transform:uppercase}
.btn:hover{background:rgba(255,180,90,.14);border-color:rgba(255,180,90,.55);padding-left:24px}
.btn.primary{background:linear-gradient(90deg,rgba(255,140,46,.22),rgba(255,140,46,.06));
 border-color:rgba(255,140,46,.5)}
.btn.primary:hover{background:linear-gradient(90deg,rgba(255,140,46,.36),rgba(255,140,46,.12))}
.btn.ghost{color:var(--dim)}
.row{display:flex;gap:11px}.row .btn{margin-top:11px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 0;
 border-bottom:1px solid rgba(255,255,255,.06)}
.setrow:last-child{border-bottom:0}
.setrow label{font-size:12.5px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase}
.setrow .val{font-size:11px;color:var(--amber);letter-spacing:.08em;min-width:52px;text-align:right}
select,input[type=range]{font-family:inherit;background:rgba(255,255,255,.06);color:var(--txt);
 border:1px solid var(--line);padding:6px 10px;font-size:12.5px;outline:none}
select{cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:190px;height:4px;padding:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--amber);
 border-radius:50%;box-shadow:0 0 10px rgba(255,180,90,.8)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--amber);border:0;border-radius:50%}
.hkeys{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px}
.hk{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);
 border-bottom:1px dotted rgba(255,255,255,.09);padding-bottom:5px}
.hk b{color:var(--txt);font-weight:600}
#endTitle{font-size:46px;font-weight:800;letter-spacing:.12em}
#endTitle.win{color:#ffd67a;text-shadow:0 0 40px rgba(255,190,90,.5)}
#endTitle.lose{color:#ff5555;text-shadow:0 0 40px rgba(255,50,50,.45)}
#endDesc{margin-top:10px;font-size:13px;color:var(--dim);letter-spacing:.08em;line-height:1.7}
#statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 6px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:12px 10px;text-align:center}
.stat .sv{font-size:24px;font-weight:700;color:var(--amber)}
.stat .sl{font-size:10px;letter-spacing:.16em;color:var(--dim);margin-top:4px;text-transform:uppercase}
#loadBar{height:3px;background:rgba(255,255,255,.08);margin-top:26px;overflow:hidden}
#loadBar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber2),#ffd9a0);
 transition:width .2s;box-shadow:0 0 14px rgba(255,140,46,.8)}
#loadTxt{margin-top:12px;font-size:11px;letter-spacing:.28em;color:var(--dim);text-align:center}
.tip{margin-top:16px;font-size:11.5px;color:var(--dim);line-height:1.85;letter-spacing:.03em}
.tip b{color:var(--amber)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="vignette"></div><div id="grain"></div><div id="damage"></div><div id="lowhp"></div>

<div id="hud">
  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hitmark"><i></i><i></i><i></i><i></i></div>
  <div id="scope"><div class="vig"></div><div class="lens"></div>
    <div class="ret"><i class="h"></i><i class="v"></i><i class="dot"></i></div>
  </div>
  <div id="dmgdirs"></div>

  <div id="topbar">
    <div id="waveLabel" data-i18n="wave">波次</div>
    <div id="waveSub" class="num">—</div>
  </div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>

  <div id="radarWrap"><canvas id="radar" width="336" height="336"></canvas><div id="radarN">N</div></div>

  <div id="toasts"></div>

  <div id="vitals">
    <div class="vlab"><span data-i18n="health">生命</span><b class="num" id="hpTxt">100</b></div>
    <div class="bar"><i id="hpFill"></i><span></span></div>
    <div class="bar sm"><i class="sp" id="spFill"></i></div>
    <div id="scrapRow"><span class="sq"></span><span class="num" id="scrapTxt">0</span><span data-i18n="scrap">废料</span></div>
  </div>

  <div id="ammoBox">
    <div id="wepName">—</div>
    <div id="ammoLine"><span id="magTxt" class="num">30</span><span class="sep">/</span><span id="resTxt" class="num res">150</span></div>
    <div id="wepSlots"></div>
  </div>

  <div id="prompt"></div>
  <div id="debug"></div>
</div>

<!-- LOADING -->
<div class="screen on" id="scLoad"><div class="panel pnl-sm" style="text-align:center">
  <h1 class="logo" style="font-size:40px">DEAD DAWN</h1>
  <div class="sub" data-i18n="loading">生成世界中…</div>
  <div id="loadBar"><i></i></div>
  <div id="loadTxt">0%</div>
</div></div>

<!-- MAIN MENU -->
<div class="screen" id="scMenu"><div class="panel">
  <h1 class="logo">DEAD DAWN</h1>
  <div class="sub" data-i18n="game_sub">末日据点 · 第一人称生存射击</div>
  <div class="rule"></div>
  <button class="btn primary" id="btnPlay" data-i18n="start">开始游戏</button>
  <button class="btn" id="btnSet" data-i18n="settings">设置</button>
  <button class="btn" id="btnHelp" data-i18n="controls">操作说明</button>
  <div class="tip" data-i18n="intro_tip">守住废弃军事据点，抵御一波又一波感染者。收集弹药与废料，加固路障，活到最后。</div>
</div></div>

<!-- SETTINGS -->
<div class="screen" id="scSet"><div class="panel">
  <h2 style="font-size:20px;letter-spacing:.22em;font-weight:700" data-i18n="settings">设置</h2>
  <div class="rule"></div>
  <div class="setrow"><label data-i18n="lang">语言 / Language</label>
    <select id="setLang"><option value="zh">中文</option><option value="en">English</option></select></div>
  <div class="setrow"><label data-i18n="sens">鼠标灵敏度</label>
    <span style="display:flex;align-items:center;gap:12px"><input type="range" id="setSens" min="20" max="300" step="5"><span class="val num" id="sensVal"></span></span></div>
  <div class="setrow"><label data-i18n="vol">主音量</label>
    <span style="display:flex;align-items:center;gap:12px"><input type="range" id="setVol" min="0" max="100" step="5"><span class="val num" id="volVal"></span></span></div>
  <div class="setrow"><label data-i18n="bloom">泛光强度</label>
    <span style="display:flex;align-items:center;gap:12px"><input type="range" id="setBloom" min="0" max="150" step="5"><span class="val num" id="bloomVal"></span></span></div>
  <div class="setrow"><label data-i18n="quality">画质</label>
    <select id="setQual"><option value="low" data-i18n="q_low">低</option><option value="medium" data-i18n="q_med">中</option><option value="high" data-i18n="q_high">高</option></select></div>
  <div class="setrow"><label data-i18n="difficulty">难度</label>
    <select id="setDiff"><option value="0" data-i18n="d_norm">普通</option><option value="1" data-i18n="d_hard">困难</option><option value="2" data-i18n="d_night">噩梦</option></select></div>
  <div class="rule"></div>
  <button class="btn" id="btnSetBack" data-i18n="back">返回</button>
</div></div>

<!-- HELP -->
<div class="screen" id="scHelp"><div class="panel">
  <h2 style="font-size:20px;letter-spacing:.22em;font-weight:700" data-i18n="controls">操作说明</h2>
  <div class="rule"></div>
  <div class="hkeys" id="helpKeys"></div>
  <div class="tip" data-i18n="help_tip">提示：感染者会被枪声吸引。路障可以延缓它们的脚步，但挡不住长久的围攻。</div>
  <div class="rule"></div>
  <button class="btn" id="btnHelpBack" data-i18n="back">返回</button>
</div></div>

<!-- PAUSE -->
<div class="screen" id="scPause"><div class="panel pnl-sm">
  <h2 style="font-size:24px;letter-spacing:.26em;font-weight:700" data-i18n="paused">已暂停</h2>
  <div class="rule"></div>
  <button class="btn primary" id="btnResume" data-i18n="resume">继续游戏</button>
  <button class="btn" id="btnPSet" data-i18n="settings">设置</button>
  <button class="btn ghost" id="btnPMenu" data-i18n="to_menu">返回主菜单</button>
</div></div>

<!-- END -->
<div class="screen" id="scEnd"><div class="panel">
  <div id="endTitle">—</div>
  <div id="endDesc"></div>
  <div id="statGrid">
    <div class="stat"><div class="sv num" id="stWave">0</div><div class="sl" data-i18n="wave">波次</div></div>
    <div class="stat"><div class="sv num" id="stKills">0</div><div class="sl" data-i18n="kills">击杀</div></div>
    <div class="stat"><div class="sv num" id="stTime">0:00</div><div class="sl" data-i18n="survived">存活</div></div>
    <div class="stat"><div class="sv num" id="stScore">0</div><div class="sl" data-i18n="score">得分</div></div>
  </div>
  <div class="rule"></div>
  <button class="btn primary" id="btnAgain" data-i18n="retry">再来一次</button>
  <button class="btn ghost" id="btnEndMenu" data-i18n="to_menu">返回主菜单</button>
</div></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   DEAD DAWN — procedural zombie survival FPS
   Everything (models, textures, audio, world) is generated in code.
   ===================================================================== */

/* ------------------------------- i18n ------------------------------- */
const STR = {
  zh:{
    game_sub:'末日据点 · 第一人称生存射击',
    start:'开始游戏', settings:'设置', controls:'操作说明', back:'返回',
    resume:'继续游戏', to_menu:'返回主菜单', retry:'再来一次',

function makeNoise(cells,seed){

    const x0=((xi%cells)+cells)%cells,x1=(x0+1)%cells,y0=((yi%cells)+cells)%cells,y1=(y0+1)%cells;

  out.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(allNrm&&nrm.length===off*3) out.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  out.setIndex(idx);
  if(!out.attributes.normal) out.computeVertexNormals();
  return out;
}
// box with world-scaled UVs (tile = metres per texture repeat)
function boxGeo(w,h,d,tx=0,ty=0,tz=0,tile=0){
  const g=new THREE.BoxGeometry(w,h,d);
  if(tile>0){
    const uv=g.attributes.uv, dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for(let f=0;f<6;f++){ const fw=dims[f][0],fh=dims[f][1];
      for(let i=0;i<4;i++){ const k=f*4+i; uv.setXY(k,uv.getX(k)*fw/tile,uv.getY(k)*fh/tile); } }
    uv.needsUpdate=true;
  }
  g.translate(tx,ty,tz); return g;
}
// cylinder with world-scaled UVs
function cylGeo(rt,rb,h,seg,tile,open){
  const g=new THREE.CylinderGeometry(rt,rb,h,seg,1,!!open);
  if(tile>0){ const uv=g.attributes.uv, circ=Math.PI*(rt+rb);
    for(let i=0;i<uv.count;i++) uv.setXY(i,uv.getX(i)*circ/tile,uv.getY(i)*h/tile);
    uv.needsUpdate=true; }
  return g;
}
function uvScale(g,sx,sy){ const uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++) uv.setXY(i,uv.getX(i)*sx,uv.getY(i)*sy);
  uv.needsUpdate=true; return g; }
// push vertices around a bit -> hand-made, irregular look
function jitterGeo(g,amt,seed){
  const p=g.attributes.position,n=p.count;
  let s=(Math.abs(seed||1)*9781+1)&0x7fffffff;
  const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff-0.5; };
  for(let i=0;i<n;i++) p.setXYZ(i,p.getX(i)+rnd()*amt,p.getY(i)+rnd()*amt*0.55,p.getZ(i)+rnd()*amt);
  g.computeVertexNormals(); return g;
}

/* --------------------------- build textures -------------------------- */
function buildTextures(){
  const F=(base,oct,seed)=>{ const f=fbmFn(base,oct,seed); return (u,v)=>f(u*base,v*base); };
  const nA=F(4,4,11), nB=F(16,3,29), nC=F(48,2,71);

  // --- ground: dark forest floor ---
  TEX.ground=buildSurfaceFast(256,36,(u,v)=>{
    const a=nA(u,v), b=nB(u,v), c=nC(u,v);
    const grass=clamp(a*1.35-0.22,0,1);
    let r=74+a*38+b*22, g=68+a*34+b*24, b2=52+a*18+b*14;
    r=lerp(r,58,grass); g=lerp(g,82,grass); b2=lerp(b2,48,grass);
    const stone=clamp(c-0.78,0,1)*9;
    const dark=clamp(b-0.62,0,1)*0.5;
    r=clamp(r-stone-dark*26,0,255); g=clamp(g-stone-dark*22,0,255); b2=clamp(b2-stone-dark*16,0,255);
    return {r:r|0,g:g|0,b:b2|0,r2:230};
  });

  // --- concrete ---
  TEX.concrete=buildSurfaceFast(256,6,(u,v)=>{
    const a=nA(u,v), b=nB(u,v);
    let r=88+a*30, g=90+a*30, b2=90+a*28;
    const stain=clamp(b-0.55,0,1);
    r=lerp(r,52,stain*0.9); g=lerp(g,50,stain*0.9); b2=lerp(b2,46,stain*0.9);
    const grit=(nC(u,v)-0.5)*22;
    return {r:clamp(r+grit,0,255)|0,g:clamp(g+grit,0,255)|0,b:clamp(b2+grit,0,255)|0,r2:225};
  });

  // --- rusted metal panel ---
  TEX.metal=buildSurfaceFast(256,4,(u,v)=>{
    const a=nA(u,v), b=nB(u,v);
    const rust=clamp((b-0.44)*1.5,0,1);
    let r=76+a*26, g=80+a*26, b2=84+a*24;
    r=lerp(r,110,rust); g=lerp(g,68,rust); b2=lerp(b2,42,rust);
    const dark=clamp(0.42-a,0,1)*0.8;
    return {r:clamp(r*(1-dark*0.5),0,255)|0,g:clamp(g*(1-dark*0.5),0,255)|0,b:clamp(b2*(1-dark*0.5),0,255)|0,
      r2:lerp(176,246,rust)|0};   // rust is matte, bare metal keeps a little sheen
  });

  // --- wood planks ---
  TEX.wood=buildSurfaceFast(256,4,(u,v)=>{
    const plank=Math.floor(v*7), pv=(v*7)%1;
    const off=(plank*0.37)%1;
    const a=nA(u*1.0+off,v*0.35+plank*0.13), b=nB(u*2+off,v*8+plank*0.5);
    let r=104+a*38, g=76+a*26, b2=48+a*16;
    const grain=Math.abs(Math.sin((v*44+a*6)*Math.PI))*0.22;
    r=lerp(r,r*0.62,grain); g=lerp(g,g*0.62,grain); b2=lerp(b2,b2*0.62,grain);
    const seam=(pv<0.035||pv>0.965)?0.45:1;
    const dark=clamp(b-0.66,0,1);
    r=lerp(r,48,dark*0.6); g=lerp(g,36,dark*0.6); b2=lerp(b2,24,dark*0.6);
    return {r:(r*seam)|0,g:(g*seam)|0,b:(b2*seam)|0,r2:215};
  });

  // --- bark ---
  TEX.bark=buildSurfaceFast(256,3,(u,v)=>{
    const a=nA(u*3.0,v*0.45), b=nB(u*9,v*1.6);
    let r=62+a*38, g=48+a*28, b2=36+a*20;
    const ridge=clamp(0.55-b,0,1);
    r=lerp(r,28,ridge*0.8); g=lerp(g,20,ridge*0.8); b2=lerp(b2,14,ridge*0.8);
    return {r:r|0,g:g|0,b:b2|0,r2:240};
  });

  // --- zombie skin ---
  TEX.skin=buildSurfaceFast(256,1,(u,v)=>{
    const a=nA(u,v), b=nB(u,v), c=nC(u,v);
    let r=118+a*34, g=126+a*34, b2=104+a*26;
    const bruise=clamp(b-0.6,0,1)*2;
    r=lerp(r,74,bruise); g=lerp(g,58,bruise); b2=lerp(b2,58,bruise);
    const rot=clamp(c-0.72,0,1)*3;
    r=lerp(r,96,rot); g=lerp(g,88,rot); b2=lerp(b2,52,rot);
    const veins=Math.abs(Math.sin(u*46+b*9))*clamp(a-0.55,0,1)*0.35;
    r=lerp(r,60,veins); g=lerp(g,52,veins); b2=lerp(b2,46,veins);
    return {r:r|0,g:g|0,b:b2|0,r2:150};
  });

  // --- torn clothing ---
  TEX.cloth=buildSurfaceFast(128,1,(u,v)=>{
    const weave=(Math.sin(u*180)*Math.sin(v*180))*0.5+0.5;
    const a=nA(u*2,v*2), b=nB(u*5,v*5);
    let r=54+a*30+weave*10, g=50+a*26+weave*9, b2=48+a*22+weave*8;
    const dirt=clamp(b-0.6,0,1);
    r=lerp(r,34,dirt); g=lerp(g,30,dirt); b2=lerp(b2,26,dirt);
    return {r:r|0,g:g|0,b:b2|0,r2:250};
  });

  // --- shared detail maps for the infected (hue comes from vertex colours) ---
  TEX.zskin=buildSurfaceFast(256,1,(u,v)=>{
    const a=nA(u,v), b=nB(u,v), c=nC(u,v);
    const pore=(c-0.5)*30;                       // fine pores
    const mottle=(a-0.5)*26;                     // blotchy tone
    const vein=Math.abs(Math.sin(u*52+b*11))*clamp(b-0.48,0,1)*0.30;
    let g=218+mottle+pore*0.55;
    g=lerp(g,132,vein);
    const wound=clamp(c-0.86,0,1)*3;
    let r=g,g2=g,b2=g;
    r=lerp(r,158,wound*0.7); g2=lerp(g2,84,wound*0.7); b2=lerp(b2,78,wound*0.7);
    return {r:r|0,g:g2|0,b:b2|0,r2:196};
  });
  TEX.zcloth=buildSurfaceFast(128,1,(u,v)=>{
    const weave=(Math.sin(u*150)*Math.sin(v*150))*0.5+0.5;
    const a=nA(u*2,v*2), b=nB(u*5,v*5);
    const grime=clamp(b-0.52,0,1);
    let g=226+a*24+weave*16;
    g=lerp(g,134,grime*0.75);
    return {r:g|0,g:g|0,b:g|0,r2:248};
  });
  TEX.zleather=buildSurfaceFast(128,1,(u,v)=>{
    const a=nA(u*3,v*3), c=nC(u,v);
    const grain=(c-0.5)*40;
    let g=214+a*28+grain*0.6;
    return {r:g|0,g:g|0,b:g|0,r2:170};
  });

  // --- grass blade card (alpha) ---
  {
    const c=mkCanvas(64,64),ctx=c.getContext('2d'); ctx.clearRect(0,0,64,64);
    for(let i=0;i<22;i++){
      const x=3+Math.random()*58, h=13+Math.random()*25, w=1.1+Math.random()*1.7, lean=(Math.random()-0.5)*13;
      const dry=Math.random()<0.22;
      const g=ctx.createLinearGradient(0,64,0,64-h);
      if(dry){ g.addColorStop(0,'rgba(58,60,32,1)'); g.addColorStop(1,'rgba(126,116,66,1)'); }
      else { g.addColorStop(0,'rgba(56,80,40,1)'); g.addColorStop(1,'rgba(138,166,92,1)'); }
      ctx.strokeStyle=g; ctx.lineWidth=w; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,64); ctx.quadraticCurveTo(x+lean*0.4,64-h*0.6,x+lean,64-h); ctx.stroke();
    }
    // a soft clump of dirt at the base so the card reads as rooted
    const bg2=ctx.createLinearGradient(0,64,0,50);
    bg2.addColorStop(0,'rgba(40,34,26,.85)'); bg2.addColorStop(1,'rgba(40,34,26,0)');
    ctx.fillStyle=bg2; ctx.fillRect(0,52,64,12);
    TEX.grassCard=texFromCanvas(c,1,true); TEX.grassCard.wrapS=TEX.grassCard.wrapT=THREE.ClampToEdgeWrapping;
  }
  // --- radial glow sprite ---
  {
    const c=mkCanvas(128,128),ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.18,'rgba(255,236,196,.85)');
    g.addColorStop(.45,'rgba(255,170,80,.28)'); g.addColorStop(1,'rgba(255,140,40,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
    TEX.glow=texFromCanvas(c,1,true); TEX.glow.wrapS=TEX.glow.wrapT=THREE.ClampToEdgeWrapping;
  }
  // --- muzzle flash ---
  {
    const c=mkCanvas(128,128),ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(64,64,0,64,64,52);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.2,'rgba(255,225,150,.9)');
    g.addColorStop(.5,'rgba(255,150,40,.35)'); g.addColorStop(1,'rgba(255,110,20,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<7;i++){
      const a=Math.random()*Math.PI*2, len=26+Math.random()*52;
      ctx.save(); ctx.translate(64,64); ctx.rotate(a);
      const lg=ctx.createLinearGradient(0,0,len,0);
      lg.addColorStop(0,'rgba(255,240,200,.85)'); lg.addColorStop(1,'rgba(255,160,50,0)');
      ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(0,-4-Math.random()*7); ctx.lineTo(len,0);
      ctx.lineTo(0,4+Math.random()*7); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    TEX.flash=texFromCanvas(c,1,true); TEX.flash.wrapS=TEX.flash.wrapT=THREE.ClampToEdgeWrapping;
    // the viewmodel flash sprite is created at module scope (before textures exist) -> bind it now
    flashSprite.material.map=TEX.flash; flashSprite.material.needsUpdate=true;
  }
  // --- blood splat decal ---
  {
    const c=mkCanvas(128,128),ctx=c.getContext('2d'); ctx.clearRect(0,0,128,128);
    ctx.fillStyle='rgba(88,10,12,.92)';
    for(let i=0;i<26;i++){
      const a=Math.random()*6.28, d=Math.pow(Math.random(),0.6)*52, r=3+Math.random()*13;
      ctx.beginPath(); ctx.ellipse(64+Math.cos(a)*d,64+Math.sin(a)*d,r,r*(0.6+Math.random()*0.7),Math.random()*3,0,6.29); ctx.fill();
    }
    const g=ctx.createRadialGradient(64,64,0,64,64,46);
    g.addColorStop(0,'rgba(60,4,6,.95)'); g.addColorStop(.6,'rgba(70,6,8,.6)'); g.addColorStop(1,'rgba(70,6,8,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(64,64,46,0,6.29); ctx.fill();
    TEX.blood=texFromCanvas(c,1,true); TEX.blood.wrapS=TEX.blood.wrapT=THREE.ClampToEdgeWrapping;
  }
  // --- bullet hole decal ---
  {
    const c=mkCanvas(64,64),ctx=c.getContext('2d'); ctx.clearRect(0,0,64,64);
    const g=ctx.createRadialGradient(32,32,0,32,32,26);
    g.addColorStop(0,'rgba(8,7,6,.98)'); g.addColorStop(.35,'rgba(20,16,12,.85)'); g.addColorStop(1,'rgba(20,16,12,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    ctx.strokeStyle='rgba(200,190,175,.35)'; ctx.lineWidth=1;
    for(let i=0;i<9;i++){ const a=Math.random()*6.28,l=6+Math.random()*20;
      ctx.beginPath(); ctx.moveTo(32,32); ctx.lineTo(32+Math.cos(a)*l,32+Math.sin(a)*l); ctx.stroke(); }
    TEX.hole=texFromCanvas(c,1,true); TEX.hole.wrapS=TEX.hole.wrapT=THREE.ClampToEdgeWrapping;
  }
  // --- dust / smoke sprite ---
  {
    const c=mkCanvas(64,64),ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(190,180,168,.55)'); g.addColorStop(.5,'rgba(150,142,132,.22)'); g.addColorStop(1,'rgba(120,115,110,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    TEX.smoke=texFromCanvas(c,1,true); TEX.smoke.wrapS=TEX.smoke.wrapT=THREE.ClampToEdgeWrapping;
  }
  // --- acid projectile sprite ---
  {
    const c=mkCanvas(64,64),ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(32,32,0,32,32,30);
    g.addColorStop(0,'rgba(230,255,140,1)'); g.addColorStop(.35,'rgba(150,220,60,.7)'); g.addColorStop(1,'rgba(90,160,30,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
    TEX.acid=texFromCanvas(c,1,true); TEX.acid.wrapS=TEX.acid.wrapT=THREE.ClampToEdgeWrapping;
  }
  buildEnvTextures();
}

/* ------------------ environment textures & detail kit ------------------ */
/* Everything below is generated procedurally (value noise / ridged noise /
   canvas 2D). No external image is ever loaded.                            */
function buildEnvTextures(){
  const F=(base,oct,seed)=>{ const f=fbmFn(base,oct,seed); return (u,v)=>f(u*base,v*base); };
  const nA=F(4,4,101), nB=F(16,3,211), nC=F(48,2,307);
  const nD=F(7,4,401),  nE=F(96,2,503), nF=F(3,4,607);
  const ridge=v=>1-Math.abs(2*v-1);
  // thin branching hairline cracks (fine ridged noise, patchy mask)
  const crack=(u,v)=>{
    const a=ridge(nE(u,v)), b=ridge(nC(u*1.35,v*1.35));
    const m=clamp((nD(u,v)-0.40)*2.4,0,1);
    return clamp((Math.max(a,b)-0.972)*38,0,1)*m;
  };

  /* --- weathered concrete: aggregate, stains, cracks, moss, rust bleed --- */
  TEX.envConcrete=buildSurfaceFast(512,1,(u,v)=>{
    const a=nA(u,v), b=nB(u,v), c=nC(u,v), d=nD(u,v);
    let r=106+a*40, g=105+a*38, b2=99+a*35;
    const grit=(c-0.5)*28;
    r+=grit; g+=grit; b2+=grit;
    const stain=clamp(b-0.50,0,1);
    r=lerp(r,56,stain*0.85); g=lerp(g,54,stain*0.85); b2=lerp(b2,49,stain*0.85);
    const patch=clamp(d-0.66,0,1)*1.7;
    r=lerp(r,74,patch); g=lerp(g,72,patch); b2=lerp(b2,67,patch);
    const ck=crack(u,v);
    r=lerp(r,42,ck*0.78); g=lerp(g,41,ck*0.78); b2=lerp(b2,40,ck*0.78);
    // precast panel joints
    const fy=((v*2)%1), jy=Math.min(fy,1-fy);
    const fx=((u*1)%1), jx=Math.min(fx,1-fx);
    const joint=clamp(1-jy*11,0,1)*0.42+clamp(1-jx*9,0,1)*0.30;
    r=lerp(r,r*0.66,joint); g=lerp(g,g*0.66,joint); b2=lerp(b2,b2*0.66,joint);
    const rust=clamp((nF(u*0.8,v*0.55)-0.66)*2.6,0,1);
    r=lerp(r,126,rust*0.55); g=lerp(g,76,rust*0.55); b2=lerp(b2,44,rust*0.55);
    const moss=clamp((nE(u,v)-0.74)*3.2,0,1)*0.8;
    r=lerp(r,62,moss); g=lerp(g,80,moss); b2=lerp(b2,46,moss);
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:lerp(234,196,moss)|0};
  });

  /* --- painted steel: chipping paint, rust, scratches, weld seams ------ */
  TEX.envMetal=buildSurfaceFast(512,1,(u,v)=>{
    const a=nA(u,v), b=nB(u,v), c=nC(u,v), d=nD(u,v);
    let r=88+a*32, g=91+a*32, b2=86+a*30;
    const chip=clamp(c-0.79,0,1)*4;
    r=lerp(r,134,chip); g=lerp(g,136,chip); b2=lerp(b2,139,chip);
    const rust=clamp((b-0.48)*1.9,0,1)*clamp(1.25-nA(u*1.6,v*1.6),0,1);
    r=lerp(r,128,rust); g=lerp(g,72,rust); b2=lerp(b2,40,rust);
    const streak=clamp(nE(u*3,v*0.22)-0.64,0,1)*1.6;
    r=lerp(r,118,streak*0.6); g=lerp(g,72,streak*0.6); b2=lerp(b2,44,streak*0.6);
    const scr=clamp(Math.abs(Math.sin((u*41+v*13)*Math.PI+nC(u,v)*7))-0.982,0,1)*70;
    r+=scr*0.55; g+=scr*0.55; b2+=scr*0.55;
    const seam=clamp(1-Math.abs(((v*3)%1)-0.5)*14,0,1);
    r=lerp(r,r*0.72,seam); g=lerp(g,g*0.72,seam); b2=lerp(b2,b2*0.72,seam);
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:lerp(lerp(168,238,rust),214,chip)|0};
  });

  /* --- crate timber: grain, knots, splits, greyed & mossy ----------- */
  TEX.envWood=buildSurfaceFast(512,1,(u,v)=>{
    const a=nA(u*1.3,v*0.42), b=nB(u*2.6,v*7.0), c=nC(u,v);
    let r=124+a*46, g=92+a*32, b2=60+a*20;
    const grain=Math.abs(Math.sin((v*118+a*8)*Math.PI))*0.24;
    r=lerp(r,r*0.55,grain); g=lerp(g,g*0.55,grain); b2=lerp(b2,b2*0.55,grain);
    const knot=Math.pow(clamp(1-Math.hypot((u-0.31)*3.4,(v-0.62)*2.6),0,1),3.5);
    r=lerp(r,48,knot); g=lerp(g,33,knot); b2=lerp(b2,20,knot);
    const splitM=clamp((ridge(nE(u*0.8,v*0.25))-0.93)*12,0,1);
    r=lerp(r,42,splitM*0.8); g=lerp(g,28,splitM*0.8); b2=lerp(b2,18,splitM*0.8);
    const grey=clamp(nD(u*0.9,v*0.9)-0.46,0,1)*1.3;
    r=lerp(r,96,grey*0.55); g=lerp(g,92,grey*0.55); b2=lerp(b2,84,grey*0.55);
    const moss=clamp((nE(u,v)-0.72)*3,0,1)*0.65;
    r=lerp(r,64,moss); g=lerp(g,80,moss); b2=lerp(b2,44,moss);
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:lerp(236,204,moss)|0};
  });

  /* --- bark: deep furrows, knots, moss --------------------------- */
  TEX.envBark=buildSurfaceFast(512,1,(u,v)=>{
    const a=nA(u*4.5,v*0.6), b=nB(u*13,v*2.1), c=nC(u,v);
    let r=66+a*46, g=50+a*33, b2=38+a*23;
    const furrow=clamp(0.52-b,0,1);
    r=lerp(r,22,furrow*0.88); g=lerp(g,15,furrow*0.88); b2=lerp(b2,11,furrow*0.88);
    const ridge2=clamp((ridge(nF(u*3,v*0.5))-0.8)*3,0,1);
    r=lerp(r,104,ridge2*0.35); g=lerp(g,84,ridge2*0.35); b2=lerp(b2,62,ridge2*0.35);
    const moss=clamp((nE(u,v)-0.68)*2.6,0,1)*0.9;
    r=lerp(r,58,moss); g=lerp(g,72,moss); b2=lerp(b2,42,moss);
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:242};
  });

  /* --- burlap sandbag canvas ------------------------------------ */
  TEX.envCloth=buildSurfaceFast(256,1,(u,v)=>{
    const weave=(Math.sin(u*170)*Math.sin(v*170))*0.5+0.5;
    const a=nA(u*2,v*2), b=nB(u*6,v*6);
    let r=124+a*42+weave*20, g=110+a*36+weave*18, b2=82+a*28+weave*13;
    const dirt=clamp(b-0.46,0,1);
    r=lerp(r,64,dirt); g=lerp(g,56,dirt); b2=lerp(b2,42,dirt);
    const mold=clamp((nE(u,v)-0.70)*3,0,1)*0.85;
    r=lerp(r,56,mold); g=lerp(g,64,mold); b2=lerp(b2,40,mold);
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:250};
  });

  /* --- old rubber (tyres, seals) -------------------------------- */
  TEX.envRubber=buildSurfaceFast(256,1,(u,v)=>{
    const a=nA(u*4,v*4), b=nC(u,v);
    let r=30+a*20, g=29+a*19, b2=31+a*20;
    const crackM=clamp((ridge(nE(u*2,v*2))-0.9)*11,0,1);
    r=lerp(r,58,crackM*0.6); g=lerp(g,57,crackM*0.6); b2=lerp(b2,58,crackM*0.6);
    return {r:r|0,g:g|0,b:b2|0,r2:240};
  });

  /* --- faded hazard stripes ------------------------------------- */
  TEX.envHazard=buildSurfaceFast(256,1,(u,v)=>{
    const s=Math.floor((u*5+v*1.6)%2);
    const wear=clamp(nB(u,v)-0.42,0,1);
    let r=s?198:54, g=s?152:50, b2=s?42:46;
    r=lerp(r,96,wear*0.7); g=lerp(g,90,wear*0.7); b2=lerp(b2,80,wear*0.7);
    const rust=clamp((nC(u,v)-0.68)*2.2,0,1);
    r=lerp(r,122,rust*0.65); g=lerp(g,76,rust*0.65); b2=lerp(b2,44,rust*0.65);
    const scuff=clamp(Math.abs(Math.sin((u*33+v*7)*Math.PI))-0.985,0,1)*80;
    r+=scuff*0.5; g+=scuff*0.5; b2+=scuff*0.5;
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:lerp(184,244,rust)|0};
  });

  /* --- trodden dirt yard --- */
  TEX.dirt=buildSurfaceFast(512,1,(u,v)=>{
    const a=nA(u,v), b=nB(u,v), c=nC(u,v);
    let r=94+a*44, g=78+a*34, b2=58+a*24;
    const wet=clamp(b-0.52,0,1);
    r=lerp(r,54,wet*0.8); g=lerp(g,45,wet*0.8); b2=lerp(b2,35,wet*0.8);
    const gravel=clamp((c-0.60)*2.8,0,1);
    r=lerp(r,142,gravel*0.5); g=lerp(g,134,gravel*0.5); b2=lerp(b2,120,gravel*0.5);
    const moss=clamp((nE(u,v)-0.78)*3.4,0,1)*0.5;
    r=lerp(r,62,moss); g=lerp(g,78,moss); b2=lerp(b2,44,moss);
    const ck=crack(u,v);
    r=lerp(r,46,ck*0.55); g=lerp(g,36,ck*0.55); b2=lerp(b2,28,ck*0.55);
    return {r:clamp(r,0,255)|0,g:clamp(g,0,255)|0,b:clamp(b2,0,255)|0,r2:245};
  });

  /* --- decals ---------------------------------------------------- */
  const decal=(w,h,draw)=>{ const c=mkCanvas(w,h),ctx=c.getContext('2d'); ctx.clearRect(0,0,w,h); draw(ctx,w,h);
    const t=texFromCanvas(c,1,true); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t; };
  // rust bleeding downwards
  TEX.rustStreak=decal(64,256,(ctx,w,h)=>{
    for(let i=0;i<34;i++){
      const x=Math.random()*w, bw=2+Math.random()*7, len=40+Math.random()*205;
      const a=0.12+Math.random()*0.42;
      const g=ctx.createLinearGradient(0,0,0,len);
      g.addColorStop(0,'rgba(104,56,26,'+a+')'); g.addColorStop(.45,'rgba(88,48,22,'+(a*0.55)+')');
      g.addColorStop(1,'rgba(62,36,18,0)');
      ctx.fillStyle=g; ctx.fillRect(x,0,bw,len);
    }
    for(let i=0;i<8;i++){
      const x=Math.random()*w, len=20+Math.random()*80;
      const g=ctx.createLinearGradient(0,0,0,len);
      g.addColorStop(0,'rgba(132,84,40,.28)'); g.addColorStop(1,'rgba(96,60,30,0)');
      ctx.fillStyle=g; ctx.fillRect(x,0,1.2+Math.random()*1.6,len);
    }
  });
  // moss / algae patch
  TEX.mossPatch=decal(128,128,(ctx,w,h)=>{
    for(let i=0;i<46;i++){
      const x=Math.random()*w,y=Math.random()*h,r=3+Math.random()*15;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(62,88,42,.85)'); g.addColorStop(.55,'rgba(46,68,34,.5)'); g.addColorStop(1,'rgba(40,60,30,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.29); ctx.fill();
    }
  });
  // branching cracks
  TEX.crackDecal=decal(256,256,(ctx,w,h)=>{
    ctx.strokeStyle='rgba(16,14,12,.9)'; ctx.lineCap='round';
    const br=(x,y,a,len,wd)=>{
      if(len<3||wd<0.4) return;
      const nx=x+Math.cos(a)*len, ny=y+Math.sin(a)*len;
      ctx.lineWidth=wd; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke();
      br(nx,ny,a+(Math.random()-0.5)*1.2,len*0.74,wd*0.7);
      br(nx,ny,a+(Math.random()-0.5)*1.2,len*0.74,wd*0.7);
      if(Math.random()<0.35) br(nx,ny,a+(Math.random()-0.5)*2.0,len*0.5,wd*0.6);
    };
    for(let i=0;i<8;i++) br(Math.random()*w,Math.random()*h,Math.random()*6.28,22+Math.random()*22,2.4);
  });
  // grime / oil smear
  TEX.grimeDecal=decal(128,128,(ctx,w,h)=>{
    for(let i=0;i<22;i++){
      const x=Math.random()*w,y=Math.random()*h,r=6+Math.random()*26;
      const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(18,16,13,.55)'); g.addColorStop(.6,'rgba(24,21,17,.28)'); g.addColorStop(1,'rgba(24,21,17,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.29); ctx.fill();
    }
  });
  // chain-link / hesco mesh (alpha tested)
  TEX.wireMesh=decal(128,128,(ctx,w,h)=>{
    ctx.strokeStyle='rgba(150,152,150,1)'; ctx.lineWidth=2.4;
    for(let i=-h;i<w;i+=16){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+h,h); ctx.stroke(); }
    for(let i=0;i<w+h;i+=16){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i-h,h); ctx.stroke(); }
  });
  TEX.wireMesh.wrapS=TEX.wireMesh.wrapT=THREE.RepeatWrapping;   // tiles across the panel
}

/* Static props are queued here and merged per material when the world is
   finished, so hundreds of detailed pieces cost only a handful of calls.   */
const ENVQ=[];
const ENVMAT={};
function envAdd(key,geo){ if(geo) ENVQ.push({key,geo}); }
function envFlush(){
  const groups=new Map();
  for(const it of ENVQ){ let a=groups.get(it.key); if(!a){ a=[]; groups.set(it.key,a); } a.push(it.geo); }
  for(const [key,list] of groups){
    if(!list.length) continue;
    const m=new THREE.Mesh(mergeGeos(list),ENVMAT[key]||MAT[key]||MAT.concrete);
    m.castShadow=true; m.receiveShadow=true; m.matrixAutoUpdate=false; m.updateMatrix();
    scene.add(m);
  }
  ENVQ.length=0;
}

const COL=[];           // colliders {x,z,hw,hd,h,type,obj?}
const DOORS=[];         // barricadable openings
const LAMP_LIGHTS=[];
let moonLight, hemi, flashlight, muzzleLight;

function addCollider(x,z,hw,hd,h,type,ref){
  const c={x,z,hw,hd,h,type:type||'wall',ref:ref||null,active:true}; COL.push(c); return c;
}
function groundHeight(x,z){
  const r=Math.hypot(x,z);
  if(r<30) return 0;
  const t=clamp((r-30)/26,0,1);
  const n=fbmFn(4,3,7); const h=(n(((x%80)+80)/80*4,((z%80)+80)/80*4)-0.5)*2;
  return t*t*(3.5+h*2.2);
}
const MOON_DIR=new THREE.Vector3(-42,50,34).normalize();
function buildSky(){
  // gradient dome
  const skyMat=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{uTop:{value:new THREE.Color(0x04070d)},uBot:{value:new THREE.Color(0x1d2a3c)},
      uMoon:{value:MOON_DIR.clone()}},
    vertexShader:'varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`varying vec3 vP; uniform vec3 uTop,uBot,uMoon;
      void main(){ vec3 d=normalize(vP);
        float h=clamp(d.y*0.5+0.5,0.0,1.0);
        vec3 c=mix(uBot,uTop,pow(h,0.62));
        float m=pow(max(dot(d,normalize(uMoon)),0.0),90.0);
        c+=vec3(0.55,0.62,0.78)*m*1.6;
        float glow=pow(max(dot(d,normalize(uMoon)),0.0),7.0);
        c+=vec3(0.10,0.13,0.20)*glow;
        gl_FragColor=vec4(c,1.0); }`
  });
  const dome=new THREE.Mesh(new THREE.SphereGeometry(200,32,20),skyMat);
  dome.frustumCulled=false; dome.renderOrder=-10; scene.add(dome);
  // stars
  {
    const N=700, pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      const u=Math.random()*2-1, th=Math.random()*6.283, s=Math.sqrt(1-u*u);
      const r=185;
      pos[i*3]=Math.cos(th)*s*r; pos[i*3+1]=Math.abs(u)*r*0.95+8; pos[i*3+2]=Math.sin(th)*s*r;
    }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const m=new THREE.PointsMaterial({color:0xcfe0ff,size:0.85,sizeAttenuation:true,transparent:true,
      opacity:0.75,fog:false,depthWrite:false});
    const p=new THREE.Points(g,m); p.frustumCulled=false; p.renderOrder=-9; scene.add(p);
  }
  // moon disc
  {
    const mp=MOON_DIR.clone().multiplyScalar(170);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.glow,color:0x9fb6d8,transparent:true,
      depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
    halo.scale.set(46,46,1); halo.position.copy(mp); halo.renderOrder=-8; scene.add(halo);
    const disc=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.glow,color:0xf2f6ff,transparent:true,
      depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
    disc.scale.set(7.5,7.5,1); disc.position.copy(mp); disc.renderOrder=-7; scene.add(disc);
  }
}

function buildWorld(){
  // fog + sky
  scene.fog=new THREE.FogExp2(0x0d1520,0.0155);
  scene.background=new THREE.Color(0x070a10);
  buildSky();
  // hemisphere fill
  hemi=new THREE.HemisphereLight(0x3a5878,0x121610,0.78); hemi.layers.enable(3); scene.add(hemi);
  // moon
  moonLight=new THREE.DirectionalLight(0xbcd4f5,1.55);
  moonLight.position.set(-42,50,34);
  moonLight.castShadow=true;
  moonLight.shadow.mapSize.set(QUAL.shadow,QUAL.shadow);
  const sc=moonLight.shadow.camera;
  sc.left=-52; sc.right=52; sc.top=52; sc.bottom=-52; sc.near=1; sc.far=160;
  moonLight.shadow.bias=-0.0012; moonLight.shadow.normalBias=0.045;
  moonLight.layers.enable(3);
  scene.add(moonLight); scene.add(moonLight.target);
  // player flashlight (layer 0 only -> never lights the weapon)
  flashlight=new THREE.SpotLight(0xffeccc,0,30,0.44,0.62,1.6);
  flashlight.position.set(0.16,-0.10,0.05);
  flashlight.target.position.set(0.06,-0.02,-1);
  camera.add(flashlight); camera.add(flashlight.target);
  // muzzle light (lights both the world and the viewmodel)
  muzzleLight=new THREE.PointLight(0xffc070,0,18,2);
  muzzleLight.layers.enable(3);
  camera.add(muzzleLight);
  // soft ambient
  const amb=new THREE.AmbientLight(0x22303f,0.38); amb.layers.enable(3); scene.add(amb);
  // viewmodel fill (layer 3 only -> lights the weapon in the viewmodel pass, never the world)
  const vmLight=new THREE.DirectionalLight(0xcadcf5,1.55);
  vmLight.position.set(0.62,0.85,0.55); vmLight.layers.set(3); camera.add(vmLight);
  const vmTarget=new THREE.Object3D(); vmTarget.position.set(0,0,-1); camera.add(vmTarget);
  vmLight.target=vmTarget;
  // cool rim from the left so the far side of the weapon keeps a readable edge
  const vmRim=new THREE.DirectionalLight(0x7f96bb,0.62);
  vmRim.position.set(-0.85,0.30,-0.70); vmRim.layers.set(3); camera.add(vmRim);
  vmRim.target=vmTarget;

  // ---- ground ----
  const G=new THREE.PlaneGeometry(240,240,110,110);
  G.rotateX(-Math.PI/2);
  const pos=G.attributes.position;
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i),z=pos.getZ(i); pos.setY(i,groundHeight(x,z)); }
  G.computeVertexNormals();
  const ground=new THREE.Mesh(G,MAT.ground); ground.receiveShadow=true;
  ground.position.y=-0.01; scene.add(ground);

  // dirt yard inside the compound (over the forest floor)
  {
    const dg=new THREE.PlaneGeometry(37,37); dg.rotateX(-Math.PI/2);
    uvScale(dg,18.5,18.5); dg.translate(0,0.006,0);
    const dm=new THREE.Mesh(dg,MAT.dirt); dm.receiveShadow=true; scene.add(dm);
  }

  // dirt yard patch (darker trodden ground inside compound)
  {
    const c=mkCanvas(256,256),ctx=c.getContext('2d');
    ctx.clearRect(0,0,256,256);
    const g=ctx.createRadialGradient(128,128,20,128,128,128);
    g.addColorStop(0,'rgba(46,40,32,.55)'); g.addColorStop(.7,'rgba(40,36,30,.28)'); g.addColorStop(1,'rgba(40,36,30,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,256,256);
    const tx=texFromCanvas(c,1,true); tx.wrapS=tx.wrapT=THREE.ClampToEdgeWrapping;
    const yard=new THREE.Mesh(new THREE.PlaneGeometry(46,42),
      new THREE.MeshBasicMaterial({map:tx,transparent:true,depthWrite:false}));
    yard.rotation.x=-Math.PI/2; yard.position.y=0.012; yard.renderOrder=1; scene.add(yard);
  }

  buildForest();
  buildOutpost();
  buildProps();
  buildGroundDetail();
  envFlush();
}
/* trodden paths, cracked earth and moss where the ground meets the walls */
function buildGroundDetail(){
  const path=[[0,-14],[0,-6],[-3,0],[-8,6],[-6,12]];
  for(let i=0;i<path.length-1;i++){
    const x0=path[i][0],z0=path[i][1],x1=path[i+1][0],z1=path[i+1][1];
    const len=Math.hypot(x1-x0,z1-z0), ang=Math.atan2(x1-x0,z1-z0);
    for(let t=0;t<len;t+=1.5){
      const g=new THREE.PlaneGeometry(2.3+Math.random()*1.2,2.8+Math.random()*1.6);
      g.rotateX(-Math.PI/2); g.rotateY(-ang);
      g.translate(x0+(x1-x0)*t/len,0.014,z0+(z1-z0)*t/len);
      envAdd('decalGrime',g);
    }
  }
  for(let i=0;i<26;i++){
    const a=Math.random()*6.283, r=4+Math.random()*44;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, s=1.2+Math.random()*3.2;
    const g=new THREE.PlaneGeometry(s,s*0.8);
    g.rotateX(-Math.PI/2); g.rotateY(Math.random()*6.28);
    g.translate(x,groundHeight(x,z)+0.015,z);
    envAdd('decalCrack',g);
  }
  for(let i=0;i<22;i++){
    const a=Math.random()*6.283;
    const g=new THREE.PlaneGeometry(1.0+Math.random()*1.8,0.7+Math.random()*1.2);
    g.rotateX(-Math.PI/2); g.rotateY(Math.random()*6.28);
    g.translate(Math.cos(a)*13.2,0.016,Math.sin(a)*13.2);
    envAdd('decalMoss',g);
  }
}

/* ------------------------------ forest ------------------------------- */
let instTrunk,instCanopy,instCanopy2,instRock,instBush,instGrass,instLog,instDead,instStump;
function buildForest(){
  const nTrees=QUAL.trees;
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),s=new THREE.Vector3(),pv=new THREE.Vector3();
  const cc=new THREE.Color();
  /* --- trunk: tapered bole with root flare and three branches (8 m ref) --- */
  const tp=[];
  tp.push(cylGeo(0.14,0.34,8,9,1.3).translate(0,4,0));
  tp.push(cylGeo(0.34,0.48,0.38,9,1.3).translate(0,0.19,0));
  { const b=cylGeo(0.045,0.105,2.7,6,1.0); b.rotateZ(-0.55); b.translate(0.78,5.6,0.3); tp.push(b); }
  { const b=cylGeo(0.035,0.085,2.3,6,1.0); b.rotateZ(0.72); b.rotateY(1.7); b.translate(-0.62,5.0,-0.52); tp.push(b); }
  { const b=cylGeo(0.028,0.07,2.0,6,1.0); b.rotateZ(-0.42); b.rotateY(3.1); b.translate(0.58,6.5,-0.72); tp.push(b); }
  instTrunk=new THREE.InstancedMesh(mergeGeos(tp),MAT.bark,nTrees);
  instTrunk.castShadow=true; instTrunk.receiveShadow=true;
  /* --- canopy: four clumped masses instead of two blobs --- */
  const cg=new THREE.IcosahedronGeometry(1,1);
  { const p=cg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
      const l=Math.hypot(x,y,z)||1;
      const d=1+Math.sin(x*5.1+y*3.3)*0.22+Math.cos(z*4.7)*0.18+Math.sin(x*11.3-z*8.1)*0.09
        +Math.sin(y*6.7+x*2.9)*0.12;
      p.setXYZ(i,x/l*d,y/l*d,z/l*d); } cg.computeVertexNormals(); }
  instCanopy=new THREE.InstancedMesh(cg,MAT.foliage,nTrees*2);
  instCanopy2=new THREE.InstancedMesh(cg,MAT.foliage2,nTrees);
  instCanopy.castShadow=true; instCanopy2.castShadow=true;
  for(let i=0;i<nTrees;i++){
    let a=Math.random()*6.283, r=33+Math.pow(Math.random(),0.72)*58;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    const y=groundHeight(x,z);
    const hgt=5.5+Math.random()*9.5, rad=0.8+Math.random()*0.7;
    e.set(0,Math.random()*6.28,0); q.setFromEuler(e);
    s.set(rad,hgt/8,rad); pv.set(x,y,z);
    m.compose(pv,q,s); instTrunk.setMatrixAt(i,m);
    const base=Math.random()*6.28;
    for(let j=0;j<2;j++){
      const aa=base+j*2.6+Math.random()*0.8;
      const rr=(0.25+Math.random()*0.75)*rad;
      const ch=hgt*(0.13+Math.random()*0.10);
      const cw=rad*(1.5+Math.random()*1.1);
      e.set(Math.random()*0.4-0.2,Math.random()*6.28,Math.random()*0.4-0.2); q.setFromEuler(e);
      s.set(cw,ch*1.5,cw); pv.set(x+Math.cos(aa)*rr,y+hgt*(0.62+j*0.17)+Math.random()*0.6,z+Math.sin(aa)*rr);
      m.compose(pv,q,s); instCanopy.setMatrixAt(i*2+j,m);
      cc.setRGB(0.72+Math.random()*0.5,0.8+Math.random()*0.42,0.68+Math.random()*0.46);
      instCanopy.setColorAt(i*2+j,cc);
    }
    for(let j=0;j<1;j++){
      const aa=base+1.3+j*2.6+Math.random()*0.8;
      const rr=(0.2+Math.random()*0.7)*rad;
      const ch=hgt*(0.12+Math.random()*0.10);
      const cw=rad*(1.5+Math.random()*1.0);
      e.set(Math.random()*0.4-0.2,Math.random()*6.28,Math.random()*0.4-0.2); q.setFromEuler(e);
      s.set(cw,ch*1.5,cw); pv.set(x+Math.cos(aa)*rr,y+hgt*(0.50+j*0.2)+Math.random()*0.6,z+Math.sin(aa)*rr);
      m.compose(pv,q,s); instCanopy2.setMatrixAt(i+j,m);
      cc.setRGB(0.7+Math.random()*0.5,0.78+Math.random()*0.4,0.66+Math.random()*0.44);
      instCanopy2.setColorAt(i+j,cc);
    }
  }
  instTrunk.instanceMatrix.needsUpdate=true;
  instCanopy.instanceMatrix.needsUpdate=true; instCanopy2.instanceMatrix.needsUpdate=true;
  if(instCanopy.instanceColor) instCanopy.instanceColor.needsUpdate=true;
  if(instCanopy2.instanceColor) instCanopy2.instanceColor.needsUpdate=true;
  scene.add(instTrunk); scene.add(instCanopy); scene.add(instCanopy2);

  /* --- dead trees: bare, broken trunks --- */
  {
    const dp=[];
    dp.push(cylGeo(0.10,0.26,6.2,7,1.2).translate(0,3.1,0));
    { const b=cylGeo(0.03,0.07,2.2,5,0.9); b.rotateZ(-0.8); b.translate(0.7,4.4,0.2); dp.push(b); }
    { const b=cylGeo(0.03,0.06,1.8,5,0.9); b.rotateZ(0.9); b.rotateY(2.1); b.translate(-0.5,3.9,-0.4); dp.push(b); }
    { const b=cylGeo(0.02,0.05,1.5,5,0.9); b.rotateZ(-0.6); b.rotateY(4.2); b.translate(0.35,5.0,-0.3); dp.push(b); }
    const nDead=Math.max(4,Math.floor(nTrees*0.13));
    instDead=new THREE.InstancedMesh(mergeGeos(dp),MAT.bark,nDead);
    instDead.castShadow=true; instDead.receiveShadow=true;
    for(let i=0;i<nDead;i++){
      const a=Math.random()*6.283, r=30+Math.random()*55;
      const x=Math.cos(a)*r,z=Math.sin(a)*r,y=groundHeight(x,z);
      e.set((Math.random()-0.5)*0.16,Math.random()*6.28,(Math.random()-0.5)*0.16); q.setFromEuler(e);
      const sc=0.7+Math.random()*0.7; s.set(sc,sc*(0.7+Math.random()*0.6),sc);
      pv.set(x,y,z); m.compose(pv,q,s); instDead.setMatrixAt(i,m);
      cc.setRGB(0.72+Math.random()*0.3,0.7+Math.random()*0.3,0.66+Math.random()*0.3);
      instDead.setColorAt(i,cc);
    }
    instDead.instanceMatrix.needsUpdate=true;
    if(instDead.instanceColor) instDead.instanceColor.needsUpdate=true;
    scene.add(instDead);
  }
  /* --- stumps with roots --- */
  {
    const sp=[];
    sp.push(cylGeo(0.26,0.34,0.55,8,1.0).translate(0,0.27,0));
    for(let i=0;i<4;i++){
      const r=cylGeo(0.05,0.12,0.7,5,0.8); r.rotateZ(1.15);
      r.rotateY(i*1.57); r.translate(Math.cos(i*1.57)*0.34,0.08,Math.sin(i*1.57)*0.34); sp.push(r);
    }
    const nSt=Math.max(6,Math.floor(nTrees*0.16));
    instStump=new THREE.InstancedMesh(mergeGeos(sp),MAT.bark,nSt);
    instStump.castShadow=true; instStump.receiveShadow=true;
    for(let i=0;i<nSt;i++){
      const a=Math.random()*6.283, r=26+Math.random()*58;
      const x=Math.cos(a)*r,z=Math.sin(a)*r,y=groundHeight(x,z);
      e.set(0,Math.random()*6.28,0); q.setFromEuler(e);
      const sc=0.7+Math.random()*0.9; s.set(sc,sc*(0.6+Math.random()*0.8),sc);
      pv.set(x,y,z); m.compose(pv,q,s); instStump.setMatrixAt(i,m);
    }
    instStump.instanceMatrix.needsUpdate=true; scene.add(instStump);
  }

  // rocks
  const nRock=Math.floor(nTrees*0.30);
  const rg=new THREE.IcosahedronGeometry(1,1);
  { const p=rg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
      const l=Math.hypot(x,y,z)||1; const d=1+Math.sin(x*3.3+z*2.1)*0.3+Math.cos(y*4.4)*0.16;
      p.setXYZ(i,x/l*d,y/l*d*0.75,z/l*d); } rg.computeVertexNormals(); }
  instRock=new THREE.InstancedMesh(rg,MAT.rock,nRock);
  instRock.castShadow=true; instRock.receiveShadow=true;
  for(let i=0;i<nRock;i++){
    const a=Math.random()*6.283, r=20+Math.random()*70;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=groundHeight(x,z);
    e.set(Math.random()*3,Math.random()*6.28,Math.random()*3); q.setFromEuler(e);
    const sc2=0.4+Math.pow(Math.random(),2)*2.6; s.set(sc2,sc2*(0.6+Math.random()*0.6),sc2); pv.set(x,y-0.1,z);
    m.compose(pv,q,s); instRock.setMatrixAt(i,m);
    cc.setRGB(0.7+Math.random()*0.5,0.72+Math.random()*0.45,0.72+Math.random()*0.45);
    instRock.setColorAt(i,cc);
  }
  instRock.instanceMatrix.needsUpdate=true;
  if(instRock.instanceColor) instRock.instanceColor.needsUpdate=true;
  scene.add(instRock);

  // bushes
  const nBush=Math.floor(nTrees*0.55);
  const bg=new THREE.IcosahedronGeometry(1,1);
  { const p=bg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
      const l=Math.hypot(x,y,z)||1; const d=1+Math.cos(x*5+y*4)*0.22+Math.sin(z*6.3)*0.12;
      p.setXYZ(i,x/l*d,Math.abs(y/l*d)*0.8,z/l*d); } bg.computeVertexNormals(); }
  instBush=new THREE.InstancedMesh(bg,MAT.foliage2,nBush);
  instBush.castShadow=true; instBush.receiveShadow=true;
  for(let i=0;i<nBush;i++){
    const a=Math.random()*6.283, r=24+Math.random()*72;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=groundHeight(x,z);
    e.set(0,Math.random()*6.28,0); q.setFromEuler(e);
    const sc2=0.5+Math.random()*1.5; s.set(sc2,sc2*0.75,sc2); pv.set(x,y+sc2*0.25,z);
    m.compose(pv,q,s); instBush.setMatrixAt(i,m);
    cc.setRGB(0.7+Math.random()*0.55,0.8+Math.random()*0.45,0.66+Math.random()*0.5);
    instBush.setColorAt(i,cc);
  }
  instBush.instanceMatrix.needsUpdate=true;
  if(instBush.instanceColor) instBush.instanceColor.needsUpdate=true;
  scene.add(instBush);

  // fallen logs
  const nLog=26;
  const lg=cylGeo(0.26,0.33,1,8,1.2); lg.rotateZ(Math.PI/2);
  instLog=new THREE.InstancedMesh(lg,MAT.bark,nLog);
  instLog.castShadow=true; instLog.receiveShadow=true;
  for(let i=0;i<nLog;i++){
    const a=Math.random()*6.283, r=27+Math.random()*60;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=groundHeight(x,z);
    e.set(0,Math.random()*6.28,(Math.random()-0.5)*0.3); q.setFromEuler(e);
    const sc2=1.6+Math.random()*3.4; s.set(sc2,sc2*0.8,sc2*0.8); pv.set(x,y+0.22,z);
    m.compose(pv,q,s); instLog.setMatrixAt(i,m);
  }
  instLog.instanceMatrix.needsUpdate=true; scene.add(instLog);

  // grass tufts
  if(QUAL.grass>0){
    const p1=new THREE.PlaneGeometry(0.62,0.62); p1.translate(0,0.31,0);
    const p2=p1.clone(); p2.rotateY(Math.PI/2);
    const gg=mergeGeos([p1,p2]);
    instGrass=new THREE.InstancedMesh(gg,MAT.grass,QUAL.grass);
    instGrass.receiveShadow=true;
    let placed=0,guard=0;
    while(placed<QUAL.grass&&guard<QUAL.grass*8){
      guard++;
      const a=Math.random()*6.283, r=4+Math.sqrt(Math.random())*34;
      const x=Math.cos(a)*r, z=Math.sin(a)*r;
      const inHQ=(x>-3.4&&x<13.4&&z>-12.8&&z<-2.2);
      const inBR=(x>-15.2&&x<-3.8&&z>-1.4&&z<10.4);
      if(inHQ||inBR) continue;                       // keep the buildings clear
      const inYard=(x>-15.4&&x<15.4&&z>-15.4&&z<15.4);
      if(inYard&&Math.random()<0.88) continue;       // the yard is trodden dirt, not lawn
      e.set(0,Math.random()*6.28,0); q.setFromEuler(e);
      const sc2=0.45+Math.random()*0.8; s.set(sc2,sc2*(0.78+Math.random()*0.5),sc2); pv.set(x,groundHeight(x,z),z);
      m.compose(pv,q,s); instGrass.setMatrixAt(placed++,m);
    }
    instGrass.count=placed; instGrass.instanceMatrix.needsUpdate=true; scene.add(instGrass);
  }
}

/* ------------------------------ outpost ------------------------------ */
const MAT_WOOD_PANEL=null; // resolved at runtime from MAT.wood
function wallRun(axis,fixed,a0,a1,h,thick,openings,mat,panels){
  const segs=[]; let cur=a0;
  const sorted=(openings||[]).slice().sort((p,q)=>p.a-q.a);
  for(const o of sorted){ if(o.a>cur) segs.push([cur,o.a]); cur=Math.max(cur,o.b); }
  if(cur<a1) segs.push([cur,a1]);
  const seg=(s,e)=>{ const w=e-s; if(w<=0.01) return;
    wallSeg(axis,fixed,s,e,h,thick);
    if(axis==='x') addCollider((s+e)/2,fixed,w/2,thick/2,h,'wall');
    else addCollider(fixed,(s+e)/2,thick/2,w/2,h,'wall'); };
  const pan=(s,e,tag)=>{ const w=e-s; if(w<=0.05) return;
    wallPanel(axis,fixed,s,e,h,thick,Math.round(w*150),tag); };
  // breakable panels are carved out of the merged run and kept as their own
  // meshes, so the infected can actually knock a hole through them
  const pans=(panels||[]).slice().sort((p,q)=>p[0]-q[0]);
  for(const [s0,e0] of segs){
    let a=s0;
    for(const pd of pans){
      const ps=pd[0],pe=pd[1],tg=pd[2]||null;
      if(pe<=a||ps>=e0) continue;
      if(ps>a) seg(a,Math.min(ps,e0));
      pan(Math.max(ps,a),Math.min(pe,e0),tg);
      a=Math.min(pe,e0);
    }
    if(a<e0) seg(a,e0);
  }
  for(const o of (openings||[])){
    const w=o.b-o.a, top=o.top||2.3;
    if(h-top>0.03) wallLintel(axis,fixed,o.a,o.b,top,h,thick);
    // a low breach is sealed with a crouch-only collider: the player can crawl
    // out under it, the infected are too tall to ever squeeze through
    if(top<1.6){
      if(axis==='x') addCollider((o.a+o.b)/2,fixed,(o.b-o.a)/2,thick/2,top,'low');
      else addCollider(fixed,(o.a+o.b)/2,thick/2,(o.b-o.a)/2,top,'low');
    }
  }
}
/* builds one wall segment in a canonical frame (length along +x, thickness along
   z) and drops it into the shared environment batches */
function wallSegParts(axis,fixed,s,e,h,thick){
  const len=e-s, W=[],M=[],R=[],S=[];
  const main=bx(len,h,thick,1.7); main.translate(len/2,h/2,0); W.push(main);
  const plinth=bx(len,0.32,thick+0.18,1.7); plinth.translate(len/2,0.16,0); W.push(plinth);
  const cap=bx(len,0.14,thick+0.30,1.7); cap.translate(len/2,h+0.07,0); W.push(cap);
  for(let u=2.4;u<len-1.2;u+=4.6){
    const p=bx(0.38,h*0.86,thick+0.20,1.7); p.translate(u,h*0.43,0); W.push(p);
    const p2=bx(0.46,h*0.30,thick+0.26,1.7); p2.translate(u,h*0.15,0); W.push(p2);
  }
  // battle damage: broken crest, exposed rebar, rubble at the foot
  if(Math.random()<0.62){
    const du=0.9+Math.random()*Math.max(0.5,len-1.8);
    const ch=bx(0.82,0.5,thick+0.12,1.7); ch.rotateZ((Math.random()-0.5)*0.4);
    ch.translate(du,h-0.22,0); W.push(ch);
    for(let i=0;i<5;i++){
      const rb=new THREE.CylinderGeometry(0.013,0.013,0.45+Math.random()*0.6,4);
      rb.rotateZ((Math.random()-0.5)*1.0); rb.rotateX((Math.random()-0.5)*0.8);
      rb.translate(du+(Math.random()-0.5)*0.6,h+0.05,(Math.random()-0.5)*thick*0.7); M.push(rb);
    }
    for(let i=0;i<6;i++){
      const g=jitterGeo(new THREE.IcosahedronGeometry(0.13+Math.random()*0.1,0),0.07,i*3.7+du);
      g.translate(du+(Math.random()-0.5)*1.6,0.06,(Math.random()-0.5)*(thick+0.6));
      W.push(g);
    }
  }
  // weathering: rust bleeding down both faces + moss at the foot
  const nd=Math.max(2,Math.floor(len/1.4));
  for(let i=0;i<nd;i++){
    const u=Math.random()*len, side=Math.random()<0.5?1:-1;
    const rw=0.55+Math.random()*1.5, rh=1.0+Math.random()*2.3;
    const g=new THREE.PlaneGeometry(rw,rh);
    if(side<0) g.rotateY(Math.PI);
    g.translate(u,h-rh*0.55,side*(thick/2+0.013)); R.push(g);
    if(Math.random()<0.75){
      const mw=1.3+Math.random()*2.8, mh=0.45+Math.random()*0.9;
      const m2=new THREE.PlaneGeometry(mw,mh);
      if(side<0) m2.rotateY(Math.PI);
      m2.translate(u,mh*0.5,side*(thick/2+0.017)); S.push(m2);
    }
  }
  const wg=mergeGeos(W), mg=mergeGeos(M);
  const rg=R.length?mergeGeos(R):null, sg=S.length?mergeGeos(S):null;
  const place=(g)=>{ if(!g) return;
    if(axis==='x') g.translate(s,0,fixed); else { g.rotateY(-Math.PI/2); g.translate(fixed,0,s); } };
  place(wg); place(mg); place(rg); place(sg);
  return {concrete:wg, metalDark:mg, decalRust:rg, decalMoss:sg};
}
function wallSeg(axis,fixed,s,e,h,thick){
  const p=wallSegParts(axis,fixed,s,e,h,thick);
  envAdd('concrete',p.concrete); envAdd('metalDark',p.metalDark);
  if(p.decalRust) envAdd('decalRust',p.decalRust);
  if(p.decalMoss) envAdd('decalMoss',p.decalMoss);
}
/* a breakable wall section: kept out of the merged batch so it can be
   knocked down at runtime, leaving a real hole in the perimeter */
const BREACH_PANELS=[];
function wallPanel(axis,fixed,s,e,h,thick,hp,tag){
  const p=wallSegParts(axis,fixed,s,e,h,thick);
  const g=new THREE.Group();
  for(const k of ['concrete','metalDark']){
    if(!p[k]) continue;
    const m=new THREE.Mesh(p[k],ENVMAT[k]||MAT[k]);
    m.castShadow=true; m.receiveShadow=true; g.add(m);
  }
  scene.add(g);
  const c=(axis==='x')?addCollider((s+e)/2,fixed,(e-s)/2,thick/2,h,'wall')
                     :addCollider(fixed,(s+e)/2,thick/2,(e-s)/2,h,'wall');
  c.hp=hp; c.maxHp=hp; c.breakable=true; c.group=g; c.tag=tag||null;
  BREACH_PANELS.push(c);
  return c;
}
function breakWall(c){
  if(!c||!c.active) return;
  c.active=false; c.hp=0;
  if(c.group){
    scene.remove(c.group);
    c.group.traverse(o=>{ if(o.isMesh&&o.geometry) o.geometry.dispose(); });
    c.group=null;
  }
  // rubble pile left in the breach
  const g=new THREE.Group();
  for(let i=0;i<8;i++){
    const r=new THREE.Mesh(new THREE.IcosahedronGeometry(0.17+Math.random()*0.25,0),MAT.concrete);
    r.position.set(c.x+rnd(-c.hw*0.9,c.hw*0.9),0.10+Math.random()*0.22,c.z+rnd(-c.hd*0.9,c.hd*0.9));
    r.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    r.castShadow=true; r.receiveShadow=true; g.add(r);
  }
  scene.add(g);
  if(PAR) for(let i=0;i<26;i++)
    PAR.spawn(c.x+rnd(-c.hw,c.hw),rnd(0.2,1.8),c.z+rnd(-c.hd,c.hd),
      rnd(-3,3),rnd(1,5),rnd(-3,3),rnd(.5,1.1),rnd(.05,.13),0.66,0.62,0.55,9);
  Audio.wallBreak();
  toast(t('wall_breached'),'bad');
  GAME.score+=40;
  NAV.dirty=true;            // the hole changes the routes the infected can use
}
function wallLintel(axis,fixed,a,b,top,h,thick){
  const len=b-a, W=[];
  const g=bx(len,h-top,thick,1.7); g.translate(len/2,(h+top)/2,0); W.push(g);

function makeDoor(name,x,z,dir,hw,maxPanels){
  const d={name,x,z,dir,hw,panels:[],max:maxPanels,hp:0,maxHp:0,collider:null,shake:0};
  // frame (static -> merged into the environment batch)
  const parts=[];
  parts.push(bx(0.22,2.6,0.7,1.0).translate(-hw-0.11,1.3,0));
  parts.push(bx(0.22,2.6,0.7,1.0).translate(hw+0.11,1.3,0));
  parts.push(bx(hw*2+0.44,0.24,0.7,1.0).translate(0,2.5,0));
  for(const yy of [0.7,1.6,2.3]) parts.push(bx(0.07,0.2,0.76,0.5).translate(-hw-0.11,yy,0));
  parts.push(bx(0.10,0.12,0.76,0.5).translate(hw+0.11,1.25,0));
  parts.push(bx(hw*2+0.44,0.06,0.74,0.8).translate(0,0.03,0));
  const fg=mergeGeos(parts);
  if(dir==='z') fg.rotateY(-Math.PI/2);
  fg.translate(x,0,z);
  envAdd('metalDark',fg);
  d.group=new THREE.Group(); scene.add(d.group);
  const c=addCollider(x,z,dir==='x'?hw:0.35,dir==='x'?0.35:hw,2.3,'door',d);

  DOORS.push(d); return d;
}

function removePanels(d){

}

function addBuilding(x0,z0,x1,z1,h,doors,roofCol){
  const t=0.36;
  const dS=(doors||[]).filter(d=>d.side==='S'), dN=(doors||[]).filter(d=>d.side==='N');
  const dE=(doors||[]).filter(d=>d.side==='E'), dW=(doors||[]).filter(d=>d.side==='W');

  wallRun('x',z1,x0,x1,h,t,dS.map(o=>({a:o.a,b:o.b,top:o.top})),MAT.concrete);
  wallRun('z',x0,z0,z1,h,t,dW.map(o=>({a:o.a,b:o.b,top:o.top})),MAT.concrete);
  wallRun('z',x1,z0,z1,h,t,dE.map(o=>({a:o.a,b:o.b,top:o.top})),MAT.concrete);
  const cx=(x0+x1)/2, cz=(z0+z1)/2, rw=x1-x0+0.8, rd=z1-z0+0.8;
  /* ---- roof: slab, corrugated ribs, fascia, gutter, vents, antenna ---- */
  const R=[],M=[];
  const slab=bx(rw,0.26,rd,1.6); slab.translate(cx,h+0.13,cz); R.push(slab);
  for(let u=-rw/2+0.13;u<rw/2;u+=0.19){
    const c=new THREE.CylinderGeometry(0.058,0.058,rd*0.99,6,1);
    c.rotateX(Math.PI/2); c.translate(cx+u,h+0.25,cz); R.push(c);
  }
  M.push(bx(rw,0.24,0.10,1.6).translate(cx,h+0.02,cz-rd/2));
  M.push(bx(rw,0.24,0.10,1.6).translate(cx,h+0.02,cz+rd/2));
  M.push(bx(0.10,0.24,rd,1.6).translate(cx-rw/2,h+0.02,cz));
  M.push(bx(0.10,0.24,rd,1.6).translate(cx+rw/2,h+0.02,cz));
  M.push(bx(rw+0.24,0.15,0.15,1.6).translate(cx,h-0.03,cz+rd/2+0.13));
  M.push(bx(rw+0.24,0.15,0.15,1.6).translate(cx,h-0.03,cz-rd/2-0.13));
  // roof hatch + vent pipe + antenna mast
  M.push(bx(0.9,0.10,0.9,1.0).translate(cx+rw*0.22,h+0.30,cz+rd*0.18));
  M.push(bx(0.95,0.07,0.95,1.0).translate(cx+rw*0.22,h+0.40,cz+rd*0.18));
  { const vp=new THREE.CylinderGeometry(0.13,0.15,0.9,8); vp.translate(cx-rw*0.28,h+0.5,cz-rd*0.24); M.push(vp);
    const cap2=new THREE.CylinderGeometry(0.2,0.2,0.07,8); cap2.translate(cx-rw*0.28,h+0.98,cz-rd*0.24); M.push(cap2); }
  { const ax=cx-rw*0.1, az=cz+rd*0.3;
    const mast=new THREE.CylinderGeometry(0.035,0.05,2.6,5); mast.translate(ax,h+1.3,az); M.push(mast);
    for(let i=0;i<3;i++){ const arm2=new THREE.CylinderGeometry(0.016,0.016,0.9,4);
      arm2.rotateZ(Math.PI/2); arm2.translate(ax,h+1.5+i*0.5,az); M.push(arm2); } }
  envAdd('metal',mergeGeos(R));
  envAdd('metalDark',mergeGeos(M));
  // rust running off the roof edge
  {
    const R2=[];
    for(let i=0;i<7;i++){
      const px=cx+(Math.random()-0.5)*rw*0.9;
      const g=new THREE.PlaneGeometry(0.35+Math.random()*0.7,0.5+Math.random()*1.1);
      g.translate(px,h+0.05,cz+(cz>0?-rd/2:rd/2)+ (cz>0?0.09:-0.09));
      R2.push(g);
    }
    envAdd('decalRust',mergeGeos(R2));
  }
  /* ---- floor ---- */
  const fg=new THREE.PlaneGeometry(x1-x0-0.3,z1-z0-0.3); fg.rotateX(-Math.PI/2);
  uvScale(fg,(x1-x0)/2,(z1-z0)/2); fg.translate(cx,0.02,cz);
  envAdd('concrete',fg);
  /* ---- windows: glass, frame, mullions, sills, boarding ---- */
  const win=(wx,wz,wy,ry)=>{
    const w=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.0),MAT.glass);
    w.position.set(wx,wy,wz); w.rotation.y=ry||0; scene.add(w);
    const fr=[];
    fr.push(bx(2.16,0.14,0.12,1.1).translate(0,0.56,0));
    fr.push(bx(2.16,0.14,0.12,1.1).translate(0,-0.56,0));
    fr.push(bx(0.14,1.26,0.12,1.1).translate(-1.03,0,0));
    fr.push(bx(0.14,1.26,0.12,1.1).translate(1.03,0,0));
    fr.push(bx(0.07,1.0,0.09,1.1).translate(0,0,0.03));
    fr.push(bx(1.9,0.07,0.09,1.1).translate(0,0,0.03));
    const frg=mergeGeos(fr);
    if(ry) frg.rotateY(ry); frg.translate(wx,wy,wz);
    envAdd('metalDark',frg);
    const sl=bx(2.34,0.09,0.30,1.1); if(ry) sl.rotateY(ry); sl.translate(wx,wy-0.64,wz);
    envAdd('concrete',sl);
    if(Math.random()<0.45){
      const bd=[];
      for(let i=0;i<3;i++){ const b=bx(2.25,0.17,0.05,1.0); b.rotateZ((Math.random()-0.5)*0.22);

      const bdg=mergeGeos(bd); if(ry) bdg.rotateY(ry); bdg.translate(wx,wy,wz+0.07);
      envAdd('wood',bdg);
    }
  };
  for(let i=0;i<3;i++){ win(x0+2.6+i*3.2, z1+0.19, 2.2, 0); win(x0+2.6+i*3.2, z0-0.19, 2.2, 0); }
  for(let i=0;i<2;i++){ win(x1+0.19, z0+2.4+i*3.4, 2.2, Math.PI/2); }
  /* ---- wall furniture: downpipe, vent louver, conduit ---- */
  {
    const px=x0+0.35, pz=z1+0.32;
    const dp=new THREE.CylinderGeometry(0.075,0.075,h+0.4,8); dp.translate(px,(h+0.4)/2,pz); M.push(dp);
    const el=new THREE.CylinderGeometry(0.075,0.075,0.45,8); el.rotateX(Math.PI/2);
    el.translate(px,h+0.3,pz+0.2); M.push(el);
    for(let i=0;i<3;i++){ const cl=new THREE.CylinderGeometry(0.09,0.09,0.09,8); cl.translate(px,0.6+i*1.4,pz); M.push(cl); }
  }
  {
    const vx=x1+0.2, vz=cz+1.6;
    const vg=bx(0.12,0.9,1.1,1.0).translate(vx,3.4,vz); M.push(vg);
    for(let i=0;i<5;i++){ const sl=bx(0.16,0.07,1.0,0.8); sl.rotateX(0.4);
      sl.translate(vx+0.02,3.05+i*0.18,vz); M.push(sl); }
  }
  /* ---- doorway frames + doors ---- */
  for(const d of (doors||[])){
    if(d.side==='S'||d.side==='N'){
      const z=(d.side==='S')?z1:z0;
      const door=makeDoor(d.name,(d.a+d.b)/2,z,'x',(d.b-d.a)/2,d.max||3);
      door.group.rotation.y=0;
    }else{
      const x=(d.side==='E')?x1:x0;
      makeDoor(d.name,x,(d.a+d.b)/2,'z',(d.b-d.a)/2,d.max||3);
    }
  }
}

function addSandbags(x,z,len,rot){

/* lattice antenna mast */
function addMast(x,z,h){
  const M=[],UP=new THREE.Vector3(0,1,0);
  for(let i=0;i<3;i++){
    const a=i/3*Math.PI*2;
    const leg=new THREE.CylinderGeometry(0.032,0.042,h,5);
    leg.translate(Math.cos(a)*0.22,h/2,Math.sin(a)*0.22); M.push(leg);
  }
  for(let y=0.5;y<h;y+=0.85){
    for(let i=0;i<3;i++){
      const a=i/3*Math.PI*2,b=(i+1)/3*Math.PI*2;
      const p1=new THREE.Vector3(Math.cos(a)*0.22,y,Math.sin(a)*0.22);
      const p2=new THREE.Vector3(Math.cos(b)*0.22,y+0.85,Math.sin(b)*0.22);
      const dir=p2.clone().sub(p1),len=dir.length();
      const c=new THREE.CylinderGeometry(0.02,0.02,len,4);
      c.translate(0,len/2,0);
      c.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP,dir.normalize()));
      c.translate(p1.x,p1.y,p1.z); M.push(c);
    }
  }
  const top=new THREE.CylinderGeometry(0.015,0.02,1.4,4); top.translate(0,h+0.7,0); M.push(top);
  const g=mergeGeos(M); g.translate(x,0,z); envAdd('metalDark',g);
}

/* run of barbed wire fence */
function addFenceRun(x,z,rot,len){
  const M=[];

  for(let i=0;i<=n;i++){
    const p=cylGeo(0.042,0.055,1.75,6,1.2); p.translate(i*(len/n),0.87,0); M.push(p);

  }

function buildOutpost(){
  // ---- perimeter compound ----
  const WH=2.5, WT=0.5;
  // north wall (z=-14) with the main gate, south wall (z=14) with the low
  // crawl-through breach, west wall (x=-16) with the side gate, east wall
  // (x=16) with a collapsed section the infected pour through.
  // "panels" are breakable sections the infected can knock down.
  wallRun('x',-14,-16,16,WH,WT,[{a:-2.6,b:2.6,top:2.5}],MAT.concrete,[[6,10,'n']]);
  wallRun('x', 14,-16,16,WH,WT,[{a:6.5,b:9.5,top:1.2}],MAT.concrete,[[-9,-5,'s']]);
  wallRun('z',-16,-14,14,WH,WT,[{a:3,b:6,top:2.5}],MAT.concrete,[[-9,-5,'w']]);
  wallRun('z', 16,-14,14,WH,WT,[{a:-2,b:2,top:2.5}],MAT.concrete,[[6,10,'e']]);
  // rubble around the collapsed east breach
  {
    const rb=[];
    for(let i=0;i<16;i++){
      const side=(i%2)?1:-1;
      const g=jitterGeo(new THREE.IcosahedronGeometry(0.20+Math.random()*0.30,0),0.08,i*3.1);
      g.translate(16+side*rnd(0.35,1.1),rnd(0.05,0.30),rnd(-2.6,2.6));
      rb.push(g);
    }
    for(let i=0;i<5;i++){
      const rb2=new THREE.CylinderGeometry(0.02,0.02,0.8+Math.random()*0.7,4);
      rb2.rotateZ(rnd(-1.1,1.1)); rb2.rotateX(rnd(-0.7,0.7));
      rb2.translate(16+rnd(-0.4,0.4),rnd(0.2,1.0),rnd(-2.6,2.6));
      envAdd('metalDark',rb2);
    }
    envAdd('concrete',mergeGeos(rb));
  }
  // razor wire coils on top of the walls (merged -> a single draw call)
  {
    const coils=[],strands=[];
    for(const [ax,fix,from,to] of [['x',-14,-16,16],['x',14,-16,16],['z',-16,-14,14],['z',16,-14,14]]){
      for(let s=from;s<to;s+=0.55){
        if(ax==='z'&&fix===16&&s>-3.2&&s<2.8) continue;   // collapsed east breach
        const t=new THREE.TorusGeometry(0.21,0.017,4,9);
        if(ax==='x') t.rotateY(Math.PI/2);
        t.rotateZ(s*1.3);
        t.rotateX((Math.random()-0.5)*0.22);
        t.translate(ax==='x'?s:fix,WH+0.22,ax==='x'?fix:s);
        coils.push(t);
        const st=new THREE.CylinderGeometry(0.011,0.011,0.58,4);
        st.rotateZ(Math.PI/2);
        if(ax==='x') st.translate(s+0.29,WH+0.40,fix);
        else { st.rotateY(Math.PI/2); st.translate(fix,WH+0.40,s+0.29); }
        strands.push(st);
      }
    }
    envAdd('metalDark',mergeGeos(coils));
    envAdd('metalDark',mergeGeos(strands));
  }
  // gates
  makeDoor('gate_main',0,-14,'x',2.6,4);
  makeDoor('gate_side',-16,4.5,'z',1.5,3);

  // ---- buildings ----
  addBuilding(-2,-11.5,12,-3.5,4.9,[
    {side:'S',name:'hq_south',a:2.6,b:4.7,top:2.35,max:3},
    {side:'W',name:'hq_west',a:-8.6,b:-6.6,top:2.35,max:2}
  ],MAT.metal);
  addBuilding(-13.8,0,-5.2,9,3.9,[
    {side:'E',name:'barracks_east',a:3.0,b:5.0,top:2.3,max:2}
  ],MAT.metal);

  // hesco revetments stacked against the perimeter wall (camera passes above them)
  for(let i=0;i<6;i++) addHesco(-15.3,-10.6+i*3.4,0);
  for(let i=0;i<4;i++) addHesco(13.3,-8.6+i*3.4,Math.PI);
  addHesco(-8.6,13.3,Math.PI/2); addHesco(-4.1,13.3,Math.PI/2);
  // and a few on the outer side of the wall
  for(let i=0;i<3;i++) addHesco(-16.9,1.0+i*3.4,0);
  addHesco(16.9,-5.0,Math.PI);

  // HQ interior dressing
  addCrate(-0.6,0,-5.2,1.1,0.2); addCrate(-0.4,0.9,-5.4,0.9,-0.4); addCrate(0.8,0,-10.2,1.2,0.5);
  addCrate(9.9,0,-5.4,1.0,0.1); addCrate(10.4,0,-6.6,0.85,0.9);
  addBarrel(11.0,-10.4,0.3); addBarrel(10.4,-9.6,0.9);
  { // field table
    const W=[],M=[];
    W.push(bx(2.4,0.1,1.0,1.0).translate(0,0.86,0));
    for(const [dx,dz] of [[-1.05,-0.38],[1.05,-0.38],[-1.05,0.38],[1.05,0.38]]){
      M.push(bx(0.09,0.86,0.09,0.6).translate(dx,0.43,dz));
      M.push(bx(0.07,0.07,0.7,0.4).translate(dx,0.28,dz));
    }
    envAdd('wood',envXform(mergeGeos(W),5.4,0,-6.6,0));
    envAdd('metalDark',envXform(mergeGeos(M),5.4,0,-6.6,0));
    addCollider(5.4,-6.6,1.2,0.5,1,'prop'); }
  addLampPost(5.0,-7.5,3.4,0xffc070,2.6,17);
  addLampPost(-8.0,4.5,3.0,0xffb060,1.5,14);
  // HQ clutter
  addAmmoBox(2.2,-9.4,0.3); addAmmoBox(2.4,-8.9,-0.2); addAmmoBox(6.6,-4.6,1.1);
  addJerryCan(7.4,-9.9,0.4); addJerryCan(7.8,-9.5,0.1); addJerryCan(-1.0,-4.4,-0.6);
  addCabinet(11.2,-4.2,Math.PI/2); addCabinet(-1.2,-6.0,0);
  addPallet(8.6,-4.0,0.2); addPallet(1.4,-9.6,1.4);
  addPipes(4.2,-10.4,6); addTyres(10.6,-7.4,3);
  addMast(-17.4,-3.0,6.5);

  // barracks interior
  addCrate(-12.4,0,2.0,1.0,0.3); addCrate(-12.6,0,7.6,1.1,-0.2);
  addCrate(-7.0,0,8.0,0.9,0.8); addBarrel(-6.2,1.4,0.2);
  { // bunk frames
    const M=[];
    for(let i=0;i<3;i++){
      const z=3.6+i*2.1;
      M.push(bx(0.95,0.08,2.0,0.8).translate(-12.6,0.55,z));
      M.push(bx(0.95,0.08,2.0,0.8).translate(-12.6,1.45,z));
      for(const dz of [-0.95,0.95]) for(const dx of [-0.42,0.42])
        M.push(bx(0.07,1.6,0.07,0.6).translate(-12.6+dx,0.8,z+dz));
    }
    envAdd('metalDark',mergeGeos(M)); }
  addAmmoBox(-6.2,4.6,0.5); addCabinet(-13.0,8.6,Math.PI/2);
  addPallet(-8.2,2.6,-0.3); addJerryCan(-11.4,4.4,0.8);
  addTyres(-6.4,8.4,2); addPipes(-9.4,6.2,5);

  // ---- guard tower ----
  const tx=12.6,tz=11.4;
  {
    const M=[],W=[];
    for(const [ox,oz] of [[-1.7,-1.7],[1.7,-1.7],[-1.7,1.7],[1.7,1.7]]){
      const leg=bx(0.22,3.4,0.22,1.0); leg.translate(tx+ox,1.7,tz+oz); M.push(leg);
      addCollider(tx+ox,tz+oz,0.18,0.18,3.4,'prop');
      M.push(bx(0.5,0.1,0.5,0.8).translate(tx+ox,0.05,tz+oz));
    }
    for(let i=0;i<4;i++){ // cross bracing
      const z0=tz-1.7,z1=tz+1.7;
      const d=new THREE.CylinderGeometry(0.035,0.035,Math.hypot(3.4,3.4),5);
      d.rotateX(Math.PI/2); d.rotateY(i%2?0.785:-0.785);
      d.translate(tx+(i%2?1.7:-1.7),1.7,z0+1.7); M.push(d);
    }
    for(let i=0;i<4;i++){ // railing
      const rail=bx(4.2,0.12,0.12,1.0); rail.translate(tx,4.4,tz-2.05+i*1.37); M.push(rail);
      for(const dx of [-2.05,2.05]){
        const post=bx(0.1,1.05,0.1,0.6); post.translate(tx+dx,3.93,tz-2.05+i*1.37); M.push(post);
      }
    }
    // platform planks
    for(let i=0;i<8;i++) W.push(bx(0.48,0.06,4.2,0.9).translate(tx-1.68+i*0.48,3.43,tz));
    W.push(bx(4.2,0.16,4.2,0.9).translate(tx,3.32,tz));

    for(let i=0;i<8;i++){ const r=bx(0.7,0.07,0.07,0.6); r.translate(tx-2.0,0.35+i*0.42,tz); M.push(r); }
    for(const dz of [-0.3,0.3]){ const s2=bx(0.09,3.5,0.09,0.6); s2.translate(tx-2.0,1.75,tz+dz); M.push(s2); }
    envAdd('metalDark',mergeGeos(M));

  }
  // sandbags on the tower platform + a searchlight
  {
    const G=[],base=new THREE.IcosahedronGeometry(0.24,1);

  {

    const sil=new THREE.CylinderGeometry(1.9,1.9,6.2,20,1);
    { const p=sil.attributes.position;
      for(let i=0;i<p.count;i++){ const px=p.getX(i),pz=p.getZ(i);
