    sil.translate(-13.2,3.1,-9.6); B.push(sil);
    const cap=new THREE.ConeGeometry(2.0,1.1,20); cap.translate(-13.2,6.75,-9.6); M.push(cap);
    for(const yy of [0.6,2.4,4.2,5.8]){ const t=new THREE.TorusGeometry(1.93,0.05,4,20);
      t.rotateX(Math.PI/2); t.translate(-13.2,yy,-9.6); M.push(t); }
    for(let i=0;i<13;i++){ const r=bx(0.5,0.05,0.05,0.5); r.translate(-11.55,0.5+i*0.45,-9.6); M.push(r); }
    for(const dz of [-0.25,0.25]){ const s2=bx(0.07,6.0,0.07,0.6); s2.translate(-11.3,3.0,-9.6+dz); M.push(s2); }
    const hatch=new THREE.CylinderGeometry(0.42,0.42,0.12,10); hatch.translate(-13.2,7.32,-9.6); M.push(hatch);
    envAdd('metal',mergeGeos(B));
    envAdd('metalDark',mergeGeos(M));
    addCollider(-13.2,-9.6,1.9,1.9,6,'prop');
    const st=new THREE.PlaneGeometry(1.5,3.4); st.rotateY(Math.PI/2); st.translate(-11.28,2.4,-9.6);
    envAdd('decalRust',st);
  }
}

function collideCircle(pos,radius,skip){
  for(let i=0;i<COL.length;i++){
    const c=COL[i];
    if(!c.active) continue;
    if(c.type==='decal') continue;
    // the low breach in the perimeter wall: only a crouching player fits
    // under it, and the infected never can.
    if(c.type==='low'&&P.crouch>0.5) continue;
    const dx=pos.x-c.x, dz=pos.z-c.z;
    const ox=c.hw+radius-Math.abs(dx), oz=c.hd+radius-Math.abs(dz);
    if(ox>0&&oz>0){
      if(ox<oz) pos.x += (dx>=0?ox:-ox);
      else pos.z += (dz>=0?oz:-oz);
    }
  }
}
function doorBlocking(x,z,radius){
  // returns door whose doorway contains the point (used by zombie AI)
  for(const d of DOORS){
    if(d.panels.length===0) continue;
    const dx=Math.abs(x-d.x), dz=Math.abs(z-d.z);
    if(d.dir==='x'){ if(dx<d.hw+radius && dz<0.45+radius) return d; }
    else { if(dz<d.hw+radius && dx<0.45+radius) return d; }
  }
  return null;
}

function updatePlayer(dt){
  if(P.dead){ camera.position.y-=dt*0.9; camera.rotation.z+=dt*0.5; return; }
  // look
  const sens=SET.sens*0.000022;   // radians per pixel of raw mouse movement (~0.14 deg/px @ default)
  if(!(window.__DD&&window.__DD.test)){
    P.yaw   -= MOUSE.dx*sens;
    P.pitch -= MOUSE.dy*sens;
    P.pitch = clamp(P.pitch,-1.52,1.52);
  }
  MOUSE.dx=0; MOUSE.dy=0;
  if(P.yaw>Math.PI)P.yaw-=Math.PI*2; if(P.yaw<-Math.PI)P.yaw+=Math.PI*2;

  // input direction
  let ix=0,iz=0;
  if(KEYS['KeyW']||KEYS['ArrowUp'])iz-=1;
  if(KEYS['KeyS']||KEYS['ArrowDown'])iz+=1;
  if(KEYS['KeyA']||KEYS['ArrowLeft'])ix-=1;
  if(KEYS['KeyD']||KEYS['ArrowRight'])ix+=1;
  const mag=Math.hypot(ix,iz); if(mag>0){ix/=mag;iz/=mag;}
  const wantSprint=(KEYS['ShiftLeft']||KEYS['ShiftRight'])&&mag>0&&P.stamina>1&&!P.crouch&&!isReloading();
  const crouching=!!P.crouchOn;   // Q toggles the crouch stance on and off
  P.crouch=lerp(P.crouch,crouching?1:0,1-Math.pow(0.001,dt));

  let maxSpeed=4.35;
  if(wantSprint) maxSpeed=7.0;
  if(crouching) maxSpeed=2.05;
  if(P.stamina<=0) maxSpeed=Math.min(maxSpeed,3.4);

  // stamina
  if(wantSprint){ P.stamina=clamp(P.stamina-24*dt,0,100); }
  else { P.stamina=clamp(P.stamina+ (crouching?9:15)*dt,0,100); }

  // acceleration toward wish-direction  (camera forward = -sin(yaw),-cos(yaw); right = cos(yaw),-sin(yaw))
  const sin=Math.sin(P.yaw),cos=Math.cos(P.yaw);
  const wx=ix*cos+iz*sin, wz=-ix*sin+iz*cos;
  const tx=wx*maxSpeed, tz=wz*maxSpeed;
  const k=1-Math.pow(0.0001,dt);
  P.vel.x=lerp(P.vel.x,tx,k*0.85); P.vel.z=lerp(P.vel.z,tz,k*0.85);

  // gravity + jump
  if(P.onGround&&KEYS['Space']){ P.vel.y=5.1; P.onGround=false; }
  P.vel.y-=16.5*dt;
  P.pos.y+=P.vel.y*dt;
  if(P.pos.y<=0){ P.pos.y=0; P.vel.y=0; P.onGround=true; }

  // move + collide
  const nx=P.pos.x+P.vel.x*dt, nz=P.pos.z+P.vel.z*dt;
  const prevX=P.pos.x, prevZ=P.pos.z;
  P.pos.x=nx; P.pos.z=nz;
  collideCircle(P.pos,P.radius);
  P.speed=Math.hypot(P.pos.x-prevX,P.pos.z-prevZ)/Math.max(dt,0.0001);

  // head bob
  const moving=P.speed>0.4&&P.onGround;
  P.bobPhase+=dt*(moving?(wantSprint?12.5:8.2):0);
  const bobAmt=moving?(wantSprint?0.075:0.042):0;
  P.bob=lerp(P.bob,Math.sin(P.bobPhase)*bobAmt,1-Math.pow(0.001,dt));
  const rollT=clamp((P.vel.x*Math.cos(P.yaw)-P.vel.z*Math.sin(P.yaw))*0.012,-0.05,0.05);
  P.roll=lerp(P.roll,rollT,1-Math.pow(0.002,dt));

  // footsteps
  if(moving){
    P.stepT+=dt*(wantSprint?2.05:1.55);
    if(P.stepT>1){ P.stepT=0; Audio.step(P.speed>6?'run':'walk'); }
  }
  // recoil recovery
  P.recoilV*=Math.pow(0.0009,dt);
  P.recoil+=P.recoilV*dt;
  P.recoil*=Math.pow(0.0015,dt);
  P.pitch=clamp(P.pitch+P.recoil*0.0,-1.52,1.52);

  // damage vignette
  P.damageFlash=Math.max(0,P.damageFlash-dt*1.7);
  el.damage.style.opacity=P.damageFlash.toFixed(3);
  el.lowhp.style.opacity=P.hp<32?clamp((32-P.hp)/32,0,1)*0.9:0;

  // camera
  const eyeH=lerp(1.66,1.02,P.crouch);
  camera.position.set(P.pos.x,P.pos.y+eyeH+P.bob,P.pos.z);
  const rec=Math.min(P.recoil*0.9,0.12);
  camera.rotation.set(P.pitch+rec,P.yaw,P.roll+ (P.hurtT>0?Math.sin(P.hurtT*40)*0.02:0),'YXZ');
  P.hurtT=Math.max(0,P.hurtT-dt*2.4);

  // flashlight
  flashlight.intensity=lerp(flashlight.intensity,(P.flashOn?11:0),1-Math.pow(0.002,dt));
  muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*900);
}

/* --------------------------- interaction ---------------------------- */
let interactTarget=null;
function updateInteraction(){
  interactTarget=null;
  let best=2.9;
  // doors
  for(const d of DOORS){
    const dx=d.x-P.pos.x, dz=d.z-P.pos.z, dist=Math.hypot(dx,dz);
    if(dist>best) continue;
    const fwd=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,P.yaw,0));
    const dir=new THREE.Vector3(dx,0,dz).normalize();
    if(dir.dot(fwd)<0.25) continue;
    best=dist; interactTarget={kind:'door',door:d};
  }
  // pickups
  for(const p of GAME.pickups){
    if(p.dead) continue;
    const dist=Math.hypot(p.mesh.position.x-P.pos.x,p.mesh.position.z-P.pos.z);
    if(dist<1.7&&dist<best){ best=dist; interactTarget={kind:'pickup',pickup:p}; }
  }
  const pr=el.prompt;
  if(!interactTarget){ pr.classList.remove('on'); return; }
  pr.classList.add('on');
  if(interactTarget.kind==='door'){
    const d=interactTarget.door;
    const canAdd=d.panels.length<d.max&&P.scrap>=2;
    const canFix=d.hp<d.maxHp&&P.scrap>=2&&d.panels.length>0;
    if(canAdd) pr.innerHTML='<kbd>E</kbd>'+t('act_build')+'（'+t('scrap')+' 2）';
    else if(canFix) pr.innerHTML='<kbd>E</kbd>'+t('act_repair')+'（'+t('scrap')+' 2）';
    else pr.innerHTML= tf('need_scrap',2);
  }else{
    const p=interactTarget.pickup;
    pr.innerHTML='<kbd>E</kbd>'+p.label;
  }
}
function doInteract(){
  if(!interactTarget) return;
  if(interactTarget.kind==='pickup'){ collect(interactTarget.pickup); return; }
  const d=interactTarget.door;
  if(P.scrap<2){ Audio.deny(); toast(tf('need_scrap',2)); return; }
  if(d.panels.length<d.max){ P.scrap-=2; addPlank(d); Audio.build(); toast(tf('barricaded'),'good'); }
  else if(d.hp<d.maxHp){ P.scrap-=2; d.hp=Math.min(d.maxHp,d.hp+130); Audio.build(); toast(tf('repaired'),'good'); }
  else { Audio.deny(); }
}

   Everything is generated in code: chamfered receiver blocks, swept

function octBoxGeo(w,h,d){
  const g=new THREE.CylinderGeometry(0.5,0.5,d,8,1,false);
  g.rotateX(Math.PI/2); g.scale(w,h,1); return g;
}
// tube swept along an arc (deg, y=sin a, z=cos a) -> a curling finger
function fingerGeo(r,tube,a0,a1,segs){
  const pts=[];
  for(let i=0;i<=segs;i++){
    const a=lerp(a0,a1,i/segs)*Math.PI/180;
    pts.push(new THREE.Vector3(0,Math.sin(a)*r,Math.cos(a)*r));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),segs,tube,6,false);
}
// cylinder stretched between two points (arms, sleeves)
function limbGeo(a,b,r1,r2,seg){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const g=new THREE.CylinderGeometry(r1,r2,len,seg);
  g.translate(0,len/2,0);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize()));
  g.translate(a.x,a.y,a.z); return g;
}

function shoot(){

  if(w.reloading||P.dead||GAME.state!=='playing') return;
  if(w.mag<=0){ Audio.dry(); w.cool=0.25; if(w.res>0) startReload(); return; }
  w.mag--; GAME.shotsFired++;
  w.cool=60/d.rpm;
  Audio.shot(d.id,d.noise);
  // recoil
  const rec=d.recoil*(w.ads>0.6?0.72:1);
  P.recoilV+=rec*0.9;
  P.yaw+=rnd(-0.006,0.006)*rec;

  VM.trigT=1;

  vmMuzzleFx(w,d);
  // hit scan
  const camPos=camera.getWorldPosition(new THREE.Vector3());

  const spreadDeg=d.spread*(1-w.ads*0.72)*(1+Math.min(P.speed,8)*0.06)*(P.crouch>0.5?0.7:1);
  let hitAny=false;
  for(let p=0;p<d.pellets;p++){
    const a=Math.random()*6.283, r=Math.sqrt(Math.random())*spreadDeg*Math.PI/180;
    const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
    const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const dd=dir.clone().addScaledVector(right,Math.tan(r)*Math.cos(a)).addScaledVector(up,Math.tan(r)*Math.sin(a)).normalize();
    const res=raycastShot(camPos,dd);
    if(res.zombie){ damageZombie(res.zombie,res.head?d.dmg*d.head:d.dmg,dd,res.point,res.head); hitAny=true; }
    else if(res.point){ spawnImpact(res.point,dd,res.normal,res.type); }
  }
  if(hitAny){ /* hit marker handled per-shot */ }
  updateAmmoHUD();
}

/* ray vs zombies + world colliders */
const _ray=new THREE.Ray();
function raycastShot(origin,dir){
  let bestT=Infinity,bestZ=null,bestHead=false,bestPoint=null,bestNormal=null,bestType=null;
  // world colliders (axis aligned boxes)
  for(const c of COL){
    if(!c.active) continue;
    const t=rayBox(origin,dir,c.x-c.hw,c.x+c.hw,0,c.h,c.z-c.hd,c.z+c.hd);
    if(t!==null&&t<bestT){ bestT=t; bestZ=null; bestType=c.type||'wall'; bestPoint=origin.clone().addScaledVector(dir,t); bestNormal=dir.clone().negate(); }
  }
  // zombies
  for(const z of GAME.zombies){
    if(z.dead) continue;
    const t=z.rayHit(origin,dir);
    if(t!==null&&t.t<bestT){ bestT=t.t; bestZ=z; bestHead=t.head; bestType=null; bestPoint=origin.clone().addScaledVector(dir,t.t); bestNormal=null; }
  }
  if(bestZ) return {zombie:bestZ,head:bestHead,point:bestPoint,type:null};
  return {zombie:null,point:bestPoint,normal:bestNormal,type:bestType};
}
function rayBox(o,d,x0,x1,y0,y1,z0,z1){
  let tmin=0,tmax=Infinity;
  const ax=[[o.x,d.x,x0,x1],[o.y,d.y,y0,y1],[o.z,d.z,z0,z1]];
  for(const [ov,dv,a,b] of ax){
    if(Math.abs(dv)<1e-8){ if(ov<a||ov>b) return null; }
    else{ let t1=(a-ov)/dv, t2=(b-ov)/dv; if(t1>t2){const s=t1;t1=t2;t2=s;}
      if(t1>tmin) tmin=t1; if(t2<tmax) tmax=t2; if(tmin>tmax) return null; }
  }
  return tmin;
}

class Particles{
  constructor(n){
    this.n=n; this.pos=new Float32Array(n*3); this.col=new Float32Array(n*3);
    this.siz=new Float32Array(n); this.vel=new Float32Array(n*3); this.life=new Float32Array(n);
    this.max=new Float32Array(n); this.grav=new Float32Array(n); this.head=0;
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    g.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    g.setAttribute('size',new THREE.BufferAttribute(this.siz,1));
    this.geo=g;
    this.mat=new THREE.PointsMaterial({size:0.16,map:TEX.blood,vertexColors:true,transparent:true,
      depthWrite:false,sizeAttenuation:true,opacity:0.95});
    this.points=new THREE.Points(g,this.mat); this.points.frustumCulled=false; scene.add(this.points);
  }
  spawn(x,y,z,vx,vy,vz,life,size,cr,cg,cb,grav){
    const i=this.head; this.head=(this.head+1)%this.n;
    this.pos[i*3]=x;this.pos[i*3+1]=y;this.pos[i*3+2]=z;
    this.vel[i*3]=vx;this.vel[i*3+1]=vy;this.vel[i*3+2]=vz;
    this.col[i*3]=cr;this.col[i*3+1]=cg;this.col[i*3+2]=cb;
    this.life[i]=life;this.max[i]=life;this.siz[i]=size; this.grav[i]=grav===undefined?9:grav;
  }
  update(dt){
    for(let i=0;i<this.n;i++){
      if(this.life[i]<=0){ this.siz[i]=0; continue; }
      this.life[i]-=dt;
      this.vel[i*3+1]-=this.grav[i]*dt;
      this.pos[i*3]+=this.vel[i*3]*dt;
      this.pos[i*3+1]+=this.vel[i*3+1]*dt;
      this.pos[i*3+2]+=this.vel[i*3+2]*dt;
      if(this.pos[i*3+1]<0.02){ this.pos[i*3+1]=0.02; this.vel[i*3+1]*=-0.25; this.vel[i*3]*=0.6; this.vel[i*3+2]*=0.6; }
      const f=Math.max(0,this.life[i]/this.max[i]);
      this.siz[i]=this.siz[i]*0.995;
      this.col[i*3]*=(1-0.0);
    }
    this.geo.attributes.position.needsUpdate=true;
    this.geo.attributes.color.needsUpdate=true;
    this.geo.attributes.size.needsUpdate=true;
  }
}

function updateVMFX(dt){
  for(let i=VMFX.smoke.length-1;i>=0;i--){
    const p=VMFX.smoke[i];
    p.life-=dt;
    if(p.life<=0){ camera.remove(p.s); p.s.material.dispose(); VMFX.smoke.splice(i,1); continue; }
    p.vx*=1-Math.min(1,dt*1.4); p.vz*=1-Math.min(1,dt*1.1);
    p.vy=lerp(p.vy,0.30,Math.min(1,dt*1.6));
    p.s.position.x+=p.vx*dt; p.s.position.y+=p.vy*dt; p.s.position.z+=p.vz*dt;
    const t=p.life/p.max;
    p.s.material.opacity=p.op*t*t;
    p.s.scale.setScalar(p.size*(1.7-t*0.75));
  }
  for(let i=VMFX.shells.length-1;i>=0;i--){
    const p=VMFX.shells[i];
    p.life-=dt;
    if(p.life<=0){ camera.remove(p.m); p.m.geometry.dispose(); VMFX.shells.splice(i,1); continue; }
    p.vy-=9.2*dt;
    p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
    p.m.rotation.x+=p.spin.x*dt; p.m.rotation.y+=p.spin.y*dt; p.m.rotation.z+=p.spin.z*dt;
    if(p.m.position.z>-0.06){ camera.remove(p.m); p.m.geometry.dispose(); VMFX.shells.splice(i,1); }
  }

function dropMagWorld(w){

function updateWorldDebris(dt){
  for(let i=WDEBRIS.length-1;i>=0;i--){
    const p=WDEBRIS[i]; p.life-=dt;
    if(p.life<=0){ scene.remove(p.m); WDEBRIS.splice(i,1); continue; }
    p.v.y-=13*dt;
    p.m.position.addScaledVector(p.v,dt);
    p.m.rotation.x+=p.spin.x*dt; p.m.rotation.y+=p.spin.y*dt; p.m.rotation.z+=p.spin.z*dt;

function updateWeapons(dt){
  const w=currentW(), d=w.def, mesh=w.mesh;
  const reloading=w.reloading;
  /* ---- ADS ---- */
  const wantAds=MOUSE.r&&!P.dead&&!reloading;
  w.adsT=lerp(w.adsT,wantAds?1:0,1-Math.pow(0.0008,dt));
  w.ads=w.adsT;
  /* ---- cooldown + trigger ---- */
  w.cool=Math.max(0,w.cool-dt);
  if(MOUSE.l&&!P.dead){
    if(d.auto){ if(w.cool<=0) shoot(); }
    else { if(!w.trigger){ w.trigger=true; if(w.cool<=0) shoot(); } }
  } else w.trigger=false;
  /* ---- reload timeline ---- */
  if(reloading){
    w.reloadT+=dt;
    if(w.reloadT>=d.reloadT) finishReload();
  }
  /* ---- base pose ---- */
  // hip pose is tuned against the dedicated viewmodel lens (VM_FOV): the
  // receiver sits low-right, the muzzle reaches the sight line and the
  // butt stock leaves the frame at the bottom-right corner.
  const hip={x:0.1347,y:-0.1246,z:-0.4474}, ads={x:0.030,y:-0.072,z:-0.285};
  const a=w.ads;
  let px=lerp(hip.x,ads.x,a), py=lerp(hip.y,ads.y,a), pz=lerp(hip.z,ads.z,a);
  let rx=0.030, ry=0.297, rz=0.020;
  /* ---- spring sway: the weapon lags behind the view and overshoots ---- */
  VM.t=(VM.t||0)+dt;
  const swayTX=clamp(-MOUSE.rawx*0.00075,-0.030,0.030);
  const swayTY=clamp(-MOUSE.rawy*0.00075,-0.028,0.028);
  const K=240, C=22;
  VM.swayVX+=(swayTX-VM.swayX)*K*dt-VM.swayVX*C*dt;
  VM.swayVY+=(swayTY-VM.swayY)*K*dt-VM.swayVY*C*dt;
  VM.swayX+=VM.swayVX*dt; VM.swayY+=VM.swayVY*dt;
  /* ---- breathing + walk bob ---- */
  const moving=P.speed>0.4;
  const bobAmp=(moving?1:0.16)*(1-a*0.8);
  const bobX=Math.sin(P.bobPhase)*0.017*bobAmp;
  const bobY=Math.abs(Math.cos(P.bobPhase))*0.013*bobAmp;
  const bobR=Math.sin(P.bobPhase*0.5)*0.030*bobAmp;
  const brX=Math.sin(VM.t*1.15)*0.0022*(1-a*0.85);
  const brY=Math.sin(VM.t*1.83+1.1)*0.0016*(1-a*0.85);
  /* ---- sprint pose ---- */
  const sprinting=(KEYS['ShiftLeft']||KEYS['ShiftRight'])&&moving&&!MOUSE.r&&P.stamina>1&&!reloading;
  if(sprinting){ px=lerp(px,0.205,0.75); py=lerp(py,-0.195,0.75); pz=lerp(pz,-0.415,0.75);
    ry=lerp(ry,-0.22,0.85); rx=lerp(rx,0.28,0.85); rz=lerp(rz,0.14,0.85); }
  /* ---- reload choreography ---- */
  const mag=mesh.getObjectByName('mag'), lh=mesh.getObjectByName('leftHand');
  const chg=mesh.getObjectByName('chg'), trig=mesh.getObjectByName('trigger');
  const tf=mesh.getObjectByName('trigFinger');
  const lhB=(lh&&lh.userData.base)||{x:0,y:0,z:0};   // rest pose of the support hand
  if(reloading){
    const p=clamp(w.reloadT/d.reloadT,0,1);
    const stage=p<0.20?0:p<0.36?1:p<0.44?2:p<0.60?3:p<0.80?4:5;
    if(stage!==w.lastStage){
      w.lastStage=stage;
      if(d.id==='rifle'){
        if(stage===1) Audio.magOut();
        if(stage===2) dropMagWorld(w);
        if(stage===3) Audio.magIn();
        if(stage===5) Audio.bolt();
      }else if(stage===3) Audio.pump();
    }
    const dip=Math.sin(clamp(p*1.22,0,1)*Math.PI);
    py-=dip*0.115; px+=dip*0.032; rx+=dip*0.50; ry+=dip*0.30; rz+=dip*0.22;
    if(d.id==='rifle'){
      if(mag){
        let my=0,mr=0,vis=true;
        if(p<0.20){ my=0; mr=0; }
        else if(p<0.36){ const t=(p-0.20)/0.16; my=-t*0.42; mr=t*0.45; }
        else if(p<0.44){ my=-0.42; mr=0.45; vis=false; }
        else if(p<0.60){ const t=(p-0.44)/0.16; my=lerp(-0.34,0,t); mr=lerp(0.28,0,t); }
        else { my=0; mr=0; }
        mag.position.set(0,my,0); mag.rotation.x=mr; mag.visible=vis;
      }
      if(lh){
        let lx=0,ly=0,lz=0,lr=0;
        if(p<0.15){ lx=0;ly=0;lz=0;lr=0; }
        else if(p<0.34){ const t=(p-0.15)/0.19; lx=lerp(0,-0.045,t); ly=lerp(0,-0.105,t); lz=lerp(0,0.215,t); lr=lerp(0,0.45,t); }
        else if(p<0.60){ lx=-0.045;ly=-0.105;lz=0.215;lr=0.45; }
        else if(p<0.78){ const t=(p-0.60)/0.18; lx=lerp(-0.045,0,t); ly=lerp(-0.105,0,t); lz=lerp(0.215,0,t); lr=lerp(0.45,0,t); }
        lh.position.set(lhB.x+lx,lhB.y+ly,lhB.z+lz); lh.rotation.x=lr;
      }
      if(chg){ const cp=clamp((p-0.80)/0.18,0,1); chg.position.z=Math.sin(cp*Math.PI)*0.080; }
    }else{
      const pump=mesh.getObjectByName('pump');
      if(pump){ const pp=clamp((p-0.40)/0.55,0,1); const off=Math.sin(pp*Math.PI)*0.115;
        pump.position.set(0,-0.004,-0.360+off); if(lh) lh.position.set(lhB.x,lhB.y,lhB.z+off); }
    }
  }else{
    if(mag){ mag.position.set(0,0,0); mag.rotation.x=0; mag.visible=true; }
    if(lh){ lh.position.set(lhB.x,lhB.y,lhB.z); lh.rotation.x=0; }
    if(chg) chg.position.z=0;
  }
  /* ---- recoil springs (heavy, with a settle oscillation) ---- */
  VM.kickV+=(-VM.kick*880-VM.kickV*33)*dt; VM.kick+=VM.kickV*dt;
  VM.kickRotV+=(-VM.kickRot*880-VM.kickRotV*33)*dt; VM.kickRot+=VM.kickRotV*dt;
  VM.kickYawV+=(-VM.kickYaw*700-VM.kickYawV*28)*dt; VM.kickYaw+=VM.kickYawV*dt;
  VM.trigT=Math.max(0,(VM.trigT||0)-dt*7);
  pz+=VM.kick; rx-=VM.kickRot; ry+=VM.kickYaw;
  /* ---- assemble ---- */
  mesh.position.set(px+bobX+VM.swayX, py+bobY+VM.swayY+brY, pz);
  mesh.rotation.set(rx+brX-VM.swayY*2.2, ry+VM.swayX*2.6, rz+bobR,'YXZ');
  if(trig) trig.rotation.x=0.25-VM.trigT*0.35;
  if(tf) tf.rotation.x=-VM.trigT*0.22;
  /* ---- muzzle flash + cone ---- */
  VM.flashT=Math.max(0,VM.flashT-dt);
  const fc=VMFX.cone;
  if(VM.flashT>0){
    flashSprite.visible=true;
    flashSprite.position.copy(flashPos(mesh));
    flashSprite.material.rotation=Math.random()*6.28;
    flashSprite.scale.setScalar(0.13+Math.random()*0.11);
    if(fc){ fc.visible=true; fc.material.opacity=Math.min(1,VM.flashT/0.03);
      fc.rotation.z=Math.random()*6.28; fc.scale.set(0.8+Math.random()*0.5,0.7+Math.random()*0.7,0.8+Math.random()*0.6); }
  }else{ flashSprite.visible=false; if(fc) fc.visible=false; }
  /* ---- scoped: hide the weapon, zoom the world, show the optic picture ---- */
  // the optic fades in first, then the body of the weapon steps out of the
  // sight picture, then the world zooms: right mouse = real scope view.
  const so=clamp((w.ads-0.24)/0.30,0,1);
  el.scope.style.opacity=String(so);
  el.scope.classList.toggle('on',so>0.01);
  w.hidden=w.ads>0.42;
  applyWeaponVisibility();
  const zoom=clamp((w.ads-0.26)/0.46,0,1);
  camera.fov=lerp(camera.fov,76-34*zoom,1-Math.pow(0.002,dt));
  camera.updateProjectionMatrix();
  updateVMFX(dt);
  updateWorldDebris(dt);
}

const ZTYPE={

  runner :{hp:72, speed:4.35,dmg:16,scale:0.94,arm:-0.55,score:18,r:0.36,color:0xd8e0c0,type:'runner'},

/* ===================== procedural humanoid kit ==========================
   Nothing is loaded from disk: bodies are lofted from elliptical cross
   sections, limbs are swept tubes and heads are noise-deformed spheres.
   Vertex colours carry every skin / cloth tone so the three shared detail
   maps can dress a whole population of different-looking infected.      */
function hash3(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453123; return s-Math.floor(s); }
function vnoise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const l=(a,b,t)=>a+(b-a)*t,c=(i,j,k)=>hash3(xi+i,yi+j,zi+k);
  return l(l(l(c(0,0,0),c(1,0,0),u),l(c(0,1,0),c(1,1,0),u),v),
           l(l(c(0,0,1),c(1,0,1),u),l(c(0,1,1),c(1,1,1),u),v),w);
}
function fbm3(x,y,z,oct){
  let v=0,a=.5,t=0;
  for(let i=0;i<oct;i++){ v+=a*vnoise3(x,y,z); t+=a; x*=2.03;y*=2.01;z*=1.97; a*=.5; }
  return v/t;
}
function xf(g,px,py,pz,rx,ry,rz,sx,sy,sz){
  const m=new THREE.Matrix4();
  m.compose(new THREE.Vector3(px||0,py||0,pz||0),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),
    new THREE.Vector3(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz));
  g.applyMatrix4(m); return g;
}
function mergeParts(list){
  const useCol=list.some(g=>g.attributes.color);
  const pos=[],nor=[],uv=[],col=[],idx=[]; let off=0;
  for(const g of list){
    const p=g.attributes.position,nr=g.attributes.normal,u=g.attributes.uv,c=g.attributes.color,ix=g.index;
    for(let i=0;i<p.count;i++){
      pos.push(p.getX(i),p.getY(i),p.getZ(i));
      if(nr) nor.push(nr.getX(i),nr.getY(i),nr.getZ(i));
      uv.push(u?u.getX(i):0,u?u.getY(i):0);
      if(useCol) col.push(c?c.getX(i):1,c?c.getY(i):1,c?c.getZ(i):1);
    }
    if(ix){ for(let i=0;i<ix.count;i++) idx.push(ix.getX(i)+off); }
    else { for(let i=0;i<p.count;i++) idx.push(i+off); }
    off+=p.count;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  if(nor.length===off*3) out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  if(useCol) out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  out.setIndex(idx);
  if(nor.length!==off*3) out.computeVertexNormals();
  out.computeBoundingSphere();
  return out;
}
/* stack of elliptical rings -> solid organic volume (torso, boots, pelvis) */
function ringGeo(rings,capA,capB){
  const n=rings[0].length,pos=[],uvs=[],idx=[];
  for(let i=0;i<rings.length;i++)
    for(let j=0;j<n;j++){ const v=rings[i][j]; pos.push(v.x,v.y,v.z); uvs.push(j/n,i/(rings.length-1||1)); }
  for(let i=0;i<rings.length-1;i++){
    const a=i*n,b=(i+1)*n;
    for(let j=0;j<n;j++){ const j2=(j+1)%n; idx.push(a+j,b+j,b+j2,a+j,b+j2,a+j2); }
  }
  if(capA){
    const c=new THREE.Vector3(); for(const v of rings[0]) c.add(v); c.multiplyScalar(1/n);
    const ci=pos.length/3; pos.push(c.x,c.y,c.z); uvs.push(.5,.5);
    for(let j=0;j<n;j++){ const j2=(j+1)%n; idx.push(ci,j,j2); }
  }
  if(capB){
    const off=(rings.length-1)*n;
    const c=new THREE.Vector3(); for(const v of rings[rings.length-1]) c.add(v); c.multiplyScalar(1/n);
    const ci=pos.length/3; pos.push(c.x,c.y,c.z); uvs.push(.5,.5);
    for(let j=0;j<n;j++){ const j2=(j+1)%n; idx.push(ci,off+j2,off+j); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function loftGeo(sec,n){
  const rings=sec.map(s=>{
    const r=[];
    for(let j=0;j<n;j++){ const th=j/n*6.2832;
      r.push(new THREE.Vector3((s.x||0)+Math.cos(th)*s.rx,s.y,(s.z||0)+Math.sin(th)*s.rz)); }
    return r;
  });
  return ringGeo(rings,true,true);
}
/* partial loft: an open jacket / vest panel (sections may be given top-down) */
function loftArc(sec,n,a0,a1){
  const s=(sec.length>1&&sec[0].y>sec[sec.length-1].y)?sec.slice().reverse():sec;
  const rings=s.map(s=>{
    const r=[];
    for(let j=0;j<=n;j++){ const th=a0+(a1-a0)*(j/n);
      r.push(new THREE.Vector3((s.x||0)+Math.cos(th)*s.rx,s.y,(s.z||0)+Math.sin(th)*s.rz)); }
    return r;
  });
  return ringGeo(rings,false,false);
}
/* swept tube along a polyline: limbs, fingers, hoses, chains */
function tubeGeo(pts,radii,n,sq){
  const rings=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    const t=new THREE.Vector3(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
    if(t.lengthSq()<1e-9) t.set(0,1,0);
    t.normalize();
    const ref=Math.abs(t.y)>0.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
    const nn=new THREE.Vector3().crossVectors(t,ref).normalize();
    const bb=new THREE.Vector3().crossVectors(nn,t).normalize();
    const r=radii[i],z=sq||1,ring=[];
    for(let j=0;j<n;j++){
      const th=j/n*6.2832,cs=Math.cos(th),sn=Math.sin(th);
      ring.push(new THREE.Vector3(p[0]+nn.x*cs*r+bb.x*sn*r*z,
                                  p[1]+nn.y*cs*r+bb.y*sn*r*z,
                                  p[2]+nn.z*cs*r+bb.z*sn*r*z));
    }
    rings.push(ring);
  }
  return ringGeo(rings,true,true);
}
/* noise-deformed ellipsoid: skulls, bellies, muscle masses */
function blobGeo(rx,ry,rz,seg,rings,warp){
  const g=new THREE.SphereGeometry(1,seg,rings);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const k=warp?warp(x,y,z):1;
    p.setXYZ(i,x*rx*k,y*ry*k,z*rz*k);
  }
  g.computeVertexNormals(); return g;
}
/* ragged cloth hem: a ring of torn triangles */
function raggedHem(rx,rz,y,n,minL,maxL){
  const pos=[],idx=[];
  for(let i=0;i<n;i++){
    const a0=i/n*6.2832,a1=(i+1)/n*6.2832;
    const len=minL+Math.random()*(maxL-minL);
    const x0=Math.cos(a0)*rx,z0=Math.sin(a0)*rz,x1=Math.cos(a1)*rx,z1=Math.sin(a1)*rz;
    const b=pos.length/3;
    pos.push(x0,y,z0, x1,y,z1, x1,y-len,z1*1.02, x0,y,z0, x1,y-len,z1*1.02, x0,y-len,z0*1.02);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(new Float32Array(pos.length/3*2),2));
  for(let i=0;i<pos.length/3;i+=3) idx.push(i,i+1,i+2);
  g.setIndex(idx); g.computeVertexNormals();
  return g;

/* hair shell: a dome that hugs the skull with a natural hairline and ragged tufts */
function hairCapGeo(S,style){
  const SEG=22,ROW=8,pos=[],uvs=[],idx=[];
  const SX=0.076*S,SY=0.106*S,SZ=0.088*S;          // must match the skull blob
  const bald=(style==='bald');
  const off=bald?0.005*S:0.011*S;
  const A=[];
  for(let j=0;j<SEG;j++){
    const a=j/SEG*6.2832;
    const fr=Math.max(0,Math.sin(a)),bk=Math.max(0,-Math.sin(a)),wSide=1-Math.abs(Math.sin(a));
    let thMax=1.26*fr+1.62*wSide+2.02*bk;      // hairline: high front, low nape
    const rag=0.055*Math.sin(a*6.1+1.3)+0.030*Math.sin(a*13.7-0.7)+0.018*Math.sin(a*23.1+2.2);
    thMax+=rag*(bald?0.40:1.0);
    if(bald) thMax=0.55*thMax+0.12;
    A.push([a,thMax]);
  }
  for(let r=0;r<ROW;r++){                         // rows go bottom -> top
    const t=1-r/(ROW-1);
    for(let j=0;j<SEG;j++){
      const a=A[j][0],thMax=A[j][1];
      const th=0.13+(thMax-0.13)*t;
      const c=Math.cos(th),sn=Math.sin(th);
      const y=SY*c+off*(0.45+0.55*c);
      const zf=sn>=0?(1-0.13*sn):(1-0.08*sn);   // follow the skull's flat face / occiput
      const rx=SX*sn+off*sn*0.95, rz=SZ*sn*zf+off*sn*0.95;
      pos.push(Math.cos(a)*rx,y,Math.sin(a)*rz);
      uvs.push(j/SEG,1-t);
    }
  }
  for(let r=0;r<ROW-1;r++){
    const A0=r*SEG,B0=(r+1)*SEG;
    for(let j=0;j<SEG;j++){ const j2=(j+1)%SEG; idx.push(A0+j,B0+j,B0+j2,A0+j,B0+j2,A0+j2); }
  }
  const apex=pos.length/3;                        // crown cap
  pos.push(0,SY+off*1.02,0); uvs.push(.5,0);
  const top=(ROW-1)*SEG;
  for(let j=0;j<SEG;j++){ const j2=(j+1)%SEG; idx.push(apex,top+j2,top+j); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
/* bake per-vertex colour (skin tone, bruising, blood, grime) */
function paint(g,fn){
  const p=g.attributes.position,n=p.count,arr=new Float32Array(n*3),o=[0,0,0];
  for(let i=0;i<n;i++){
    fn(p.getX(i),p.getY(i),p.getZ(i),o);
    arr[i*3]=o[0];arr[i*3+1]=o[1];arr[i*3+2]=o[2];
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(arr,3));
  return g;
}
/* per-bone bucket: every material of one bone merges into one mesh */
function PartSet(){ this.m={}; }
PartSet.prototype.add=function(k,g){ (this.m[k]=this.m[k]||[]).push(g); return this; };
PartSet.prototype.build=function(mats,parent,shadow){
  for(const k in this.m){
    if(!this.m[k].length) continue;
    const mesh=new THREE.Mesh(mergeParts(this.m[k]),mats[k]);
    mesh.castShadow=shadow!==false; mesh.receiveShadow=false; parent.add(mesh);
  }
};

const ZMATS={};
function ensureZMats(){

    const m=new THREE.MeshStandardMaterial({map:t.map,normalMap:t.nrm,roughnessMap:t.rgh,
      roughness:rough,metalness:metal,normalScale:new THREE.Vector2(ns,ns),vertexColors:true});
    m.emissive=new THREE.Color(em||0x000000); m.emissiveIntensity=1;
    return m;
  };
  ZMATS.skinBase=zstd(TEX.zskin,.74,0,1.3,0x161009);
  ZMATS.clothBase=zstd(TEX.zcloth,.96,0,1.0,0x0b0a07);

   the short way in - smash straight through it instead of milling about. */
const NAV={cell:0.5,x0:-32,z0:-32,nx:128,nz:128,
           blocked:null,pcost:null,dist:null,buckets:null,dirty:true,acc:0};
const NDX=[1,-1,0,0,1,1,-1,-1], NDZ=[0,0,1,-1,1,-1,1,-1];
NAV.dist=new Int32Array(NAV.nx*NAV.nz);
NAV.buckets=[]; for(let i=0;i<1024;i++) NAV.buckets.push([]);
function navRebuildBlocked(){
  const {cell,x0,z0,nx,nz}=NAV;
  const blocked=new Uint8Array(nx*nz), pcost=new Uint8Array(nx*nz);
  for(let iz=0;iz<nz;iz++){
    for(let ix=0;ix<nx;ix++){
      const cx=x0+(ix+0.5)*cell, cz=z0+(iz+0.5)*cell;
      let b=0,p=0;
      for(let i=0;i<COL.length;i++){
        const c=COL[i];
        if(!c.active) continue;
        if(c.type==='decal'||c.type==='door') continue;
        const inside=Math.abs(cx-c.x)<c.hw+0.30 && Math.abs(cz-c.z)<c.hd+0.30;
        if(c.breakable){ if(inside) p=3; continue; }  // smashable: passable but costly
        if(c.type==='low'){ if(inside){b=1;break;} continue; }  // crawl hole: too tight
        if(inside){ b=1; break; }
      }
      blocked[iz*nx+ix]=b; pcost[iz*nx+ix]=p;
    }
  }
  NAV.blocked=blocked; NAV.pcost=pcost; NAV.dirty=false;
}
/* Dijkstra over the grid, seeded at the player: every cell knows how far the
   infected have to walk to reach him. */
function navField(){
  const {nx,nz,cell,x0,z0}=NAV;
  if(NAV.dirty||!NAV.blocked) navRebuildBlocked();
  const blocked=NAV.blocked, pcost=NAV.pcost, dist=NAV.dist;
  dist.fill(-1);
  const pi=Math.floor((P.pos.x-x0)/cell), pj=Math.floor((P.pos.z-z0)/cell);
  if(pi<0||pi>=nx||pj<0||pj>=nz) return dist;
  const NB=1024, buckets=NAV.buckets;
  for(let i=0;i<NB;i++) buckets[i].length=0;
  const start=pj*nx+pi; dist[start]=0; buckets[0].push(start);
  for(let cur=0;cur<NB;cur++){
    const b=buckets[cur%NB];
    if(!b.length) continue;
    while(b.length){
      const c=b.pop();
      if(dist[c]!==cur) continue;
      const ci=c%nx, cj=(c-ci)/nx;
      for(let k=0;k<8;k++){
        const ni=ci+NDX[k], nj=cj+NDZ[k];
        if(ni<0||ni>=nx||nj<0||nj>=nz) continue;
        const nc=nj*nx+ni;
        if(blocked[nc]) continue;
        if(k>=4&&(blocked[cj*nx+ni]||blocked[nj*nx+ci])) continue;  // no corner cutting
        const nd=cur+(k>=4?2:1)+pcost[nc];
        if(dist[nc]>=0&&dist[nc]<=nd) continue;
        dist[nc]=nd; buckets[nd%NB].push(nc);
      }
    }
  }
  return dist;
}
function navTarget(zr){
  const {cell,x0,z0,nx,nz,dist,blocked}=NAV;
  if(!NAV.dist) return P.pos;
  const px=zr.root.position.x, pz=zr.root.position.z;
  let ci=Math.floor((px-x0)/cell), cj=Math.floor((pz-z0)/cell);
  if(ci<0||ci>=nx||cj<0||cj>=nz) return P.pos;
  let idx=cj*nx+ci;
  if(dist[idx]<0){
    // standing in a blocked cell: hop to the closest reachable neighbour
    let nb=-1,nd=1e9;
    for(let k=0;k<8;k++){
      const ni=ci+NDX[k], nj=cj+NDZ[k];
      if(ni<0||ni>=nx||nj<0||nj>=nz) continue;
      const v=dist[nj*nx+ni];
      if(v>=0&&v<nd){nd=v;nb=nj*nx+ni;}
    }
    if(nb<0) return P.pos;
    idx=nb;
  }
  // follow the gradient a couple of cells so the walk stays smooth
  let best=idx, bd=dist[idx];
  for(let step=0;step<3;step++){
    const bi=best%nx, bj=(best-bi)/nx;
    let nb=-1,ns=1e9;
    for(let k=0;k<8;k++){
      const ni=bi+NDX[k], nj=bj+NDZ[k];
      if(ni<0||ni>=nx||nj<0||nj>=nz) continue;
      const nc=nj*nx+ni;
      const v=dist[nc];
      if(v<0) continue;
      if(k>=4&&(blocked[bj*nx+ni]||blocked[nj*nx+bi])) continue;
      if(v<ns){ns=v;nb=nc;}
    }
    if(nb<0||ns>=bd) break;
    bd=ns; best=nb;
    if(bd<=0) break;
  }
  if(best===idx) return P.pos;
  return {x:x0+(best%nx+0.5)*cell, z:z0+((best-(best%nx))/nx+0.5)*cell};
}
/* is a breakable wall panel right in front of this infected? */
function breakableAhead(z){
  let best=null,bd=1.9;
  const px=z.root.position.x, pz=z.root.position.z;
  const hx=z.hitDirX||0, hz=z.hitDirZ||0;
  for(const c of BREACH_PANELS){
    if(!c.active||c.hp<=0) continue;
    const dx=Math.max(0,Math.abs(px-c.x)-c.hw), dz=Math.max(0,Math.abs(pz-c.z)-c.hd);
    const d=Math.hypot(dx,dz);
    if(d>=bd) continue;
    const tx=c.x-px, tz=c.z-pz, tl=Math.hypot(tx,tz)||1;
    if(d>0.5 && (tx/tl)*hx+(tz/tl)*hz<0.15) continue;   // not in front of us
    bd=d; best=c;
  }
  return best;
}
function raySphere(o,d,c,r){
  const ox=o.x-c.x, oy=o.y-c.y, oz=o.z-c.z;
  const b=ox*d.x+oy*d.y+oz*d.z;
  const cc=ox*ox+oy*oy+oz*oz-r*r;
  const disc=b*b-cc;
  if(disc<0) return null;
  const s=Math.sqrt(disc);
  let t=-b-s; if(t<0.01) t=-b+s; if(t<0.01) return null;
  return t;
}
function damageZombie(z,dmg,dir,point,head){
  z.hurt(dmg,dir);
  if(PAR) for(let i=0;i<7;i++){
    PAR.spawn(point.x,point.y,point.z,dir.x*rnd(0.5,2.4)+rnd(-1,1),rnd(0.4,2.6),dir.z*rnd(0.5,2.4)+rnd(-1,1),
      rnd(.25,.55),rnd(.04,.1),0.52,0.04,0.05,10);
  }
  showHitmarker(!!head);
}
const acidPool=[];
function spawnAcid(from,dir){
  let a;

  if(!a){

      blending:THREE.AdditiveBlending}));

  }

  a.vel.copy(dir).multiplyScalar(14);
  a.life=3;
}

/* ------------------------------ waves ------------------------------- */
const DIFF=[{hp:1.0,dmg:1.0,spd:1.0},{hp:1.35,dmg:1.22,spd:1.07},{hp:1.85,dmg:1.52,spd:1.16}];
function waveComp(n){
  const c={walker:0,runner:0,brute:0,spitter:0,crawler:0};
  c.walker=Math.round(3+n*1.5);
  if(n>=2) c.runner=Math.round((n-1)*1.35);
  if(n>=4) c.brute=Math.round((n-3)*0.95);
  if(n>=5) c.spitter=Math.round((n-4)*0.85);
  if(n>=6) c.crawler=Math.round((n-5)*1.15);
  return c;
}
function spawnPos(){
  for(let i=0;i<40;i++){
    const a=Math.random()*6.283, r=rnd(26,38);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(Math.hypot(x-P.pos.x,z-P.pos.z)<18) continue;
    return {x,z};
  }
  const a=Math.random()*6.283; return {x:Math.cos(a)*30,z:Math.sin(a)*30};
}
function startWave(n){
  GAME.wave=n; GAME.waveActive=true; GAME.spawnTimer=0; GAME.spawnQueue=[];
  const comp=waveComp(n), d=DIFF[SET.diff]||DIFF[0];
  let tt=0.4;                       // NOTE: must not shadow the global t() translator
  const list=[];
  for(const k in comp) for(let i=0;i<comp[k];i++) list.push(k);
  list.sort(()=>Math.random()-0.5);
  for(let i=0;i<list.length;i++){
    GAME.spawnQueue.push({type:list[i],t:tt});
    tt+=rnd(0.55,1.5)*(i%5===0?1.6:1);
  }
  banner(tf('wave_n',n)+' · '+t('wave_incoming'), t('wave_start_sub'));
  Audio.horn();
  Audio.growlFar();
  updateWaveHUD();
}
function updateWaves(dt){
  if(GAME.state!=='playing') return;
  if(GAME.waveActive){
    if(GAME.spawnQueue.length){
      GAME.spawnTimer+=dt;
      while(GAME.spawnQueue.length&&GAME.spawnQueue[0].t<=GAME.spawnTimer){
        const q=GAME.spawnQueue.shift();
        const p=spawnPos(); const d=DIFF[SET.diff]||DIFF[0];
        const z=new Zombie(q.type,p.x,p.z,d.hp,d.dmg,d.spd);
        GAME.zombies.push(z);
        if(Math.random()<0.35) Audio.growlFar();
      }
    }else if(GAME.zombies.length===0){
      GAME.waveActive=false;
      GAME.score+=100*GAME.wave;
      banner(tf('wave_cleared'), tf('wave_clear_sub',GAME.wave));
      Audio.clear();
      dropSupplies();
      if(GAME.wave>=GAME.maxWave){ setTimeout(()=>endGame(true),2600); GAME.waveActive=false; GAME.ended=true; }
      else { GAME.nextWave=14; GAME.intermission=14; }
    }
    updateWaveHUD();
  }else if(GAME.intermission>0){
    GAME.intermission-=dt;
    if(GAME.intermission<=0){ startWave(GAME.wave+1); }
    updateWaveHUD();
  }
}
function updateWaveHUD(){
  if(GAME.waveActive){
    el.waveLabel.textContent=tf('wave_n',GAME.wave);
    el.waveSub.textContent=t('remain')+' '+GAME.zombies.length+'  +  '+GAME.spawnQueue.length;
  }else{
    el.waveLabel.textContent=tf('wave_n',Math.max(1,GAME.wave));
    el.waveSub.textContent=t('inter')+' '+Math.ceil(Math.max(0,GAME.intermission))+'s';
  }
}
function dropSupplies(){
  const a=Math.random()*6.283, r=rnd(4,9);
  const x=Math.cos(a)*r, z=Math.sin(a)*r;
  createPickup('ammo',x,z); createPickup('med',x+rnd(-1,1),z+rnd(-1,1)); createPickup('scrap',x+rnd(-1.5,1.5),z+rnd(-1.5,1.5));
  if(GAME.wave%2===0) createPickup('shell',x+rnd(-2,2),z+rnd(-2,2));
}

/* ----------------------------- pickups ------------------------------- */
const PKDEF={
  ammo :{label:()=>t('picked_ammo'),color:0x6fe08a,geo:'box',amt:'ammo'},
  shell:{label:()=>t('picked_shell'),color:0xffa64d,geo:'shell',amt:'shell'},
  med  :{label:()=>t('picked_med'),color:0xff5a5a,geo:'med',amt:'med'},
  scrap:{label:()=>t('picked_scrap'),color:0xcfd6e0,geo:'scrap',amt:'scrap'}
};
const pickupMats={};
function ensurePMats(){
  if(pickupMats.ammo) return;
  for(const k in PKDEF){
    const m=new THREE.MeshStandardMaterial({color:PKDEF[k].color,emissive:PKDEF[k].color,
      emissiveIntensity:0.85,roughness:0.45,metalness:0.3});
    pickupMats[k]=m;
  }
}
function createPickup(kind,x,z){
  ensurePMats();
  const def=PKDEF[kind];
  let g;
  if(def.geo==='box') g=new THREE.BoxGeometry(0.34,0.24,0.24);
  else if(def.geo==='med') g=new THREE.BoxGeometry(0.30,0.18,0.22);
  else if(def.geo==='shell') g=new THREE.CylinderGeometry(0.07,0.07,0.22,8);
  else g=new THREE.IcosahedronGeometry(0.15,0);
  const m=new THREE.Mesh(g,pickupMats[kind]); m.castShadow=true;
  m.position.set(x,0.45,z);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.glow,color:def.color,transparent:true,
    depthWrite:false,blending:THREE.AdditiveBlending}));
  spr.scale.set(1.1,1.1,1); spr.position.copy(m.position); scene.add(spr);
  scene.add(m);
  const p={kind,mesh:m,spr,label:def.label(),t:rnd(0,6),dead:false};
  GAME.pickups.push(p); return p;
}
function collect(p){
  if(p.dead) return;
  p.dead=true;
  scene.remove(p.mesh); scene.remove(p.spr);
  const i=GAME.pickups.indexOf(p); if(i>=0) GAME.pickups.splice(i,1);
  const w=currentW();
  switch(p.kind){
    case 'ammo':{ let add=0;
      for(const wp of WEAPONS){ const need=wp.def.maxRes-wp.res; if(need>0){ const take=Math.min(need,60); wp.res+=take; add+=take; } }
      toast(t('picked_ammo')+' +'+add,'good'); break; }
    case 'shell':{ const wp=WEAPONS[1]; const take=Math.min(wp.def.maxRes-wp.res,12); wp.res+=take;
      toast(t('picked_shell')+' +'+take,'good'); break; }
    case 'med':{ const before=P.hp; P.hp=Math.min(P.maxhp,P.hp+35);
      toast(t('picked_med')+' '+t('heal'),'good'); break; }
    case 'scrap':{ P.scrap+=2; toast(t('picked_scrap')+' +2','good'); break; }
  }
  Audio.pickup(); updateAmmoHUD(); updateVitals();
}
function updatePickups(dt){
  for(let i=GAME.pickups.length-1;i>=0;i--){
    const p=GAME.pickups[i];
    p.t+=dt;
    p.mesh.rotation.y+=dt*1.5;
    p.mesh.position.y=0.45+Math.sin(p.t*2.2)*0.08;
    p.spr.position.y=p.mesh.position.y;
    const d=Math.hypot(p.mesh.position.x-P.pos.x,p.mesh.position.z-P.pos.z);
    if(d<1.25&&Math.abs(p.mesh.position.y-0.9)<2.5) collect(p);
  }
}

/* ------------------------------ audio -------------------------------- */
const Audio={
  ctx:null,master:null,sfx:null,verb:null,verbGain:null,noiseBuf:null,ambient:null,heartT:0,
  init(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=SET.vol/100; this.master.connect(this.ctx.destination);
    this.sfx=this.ctx.createGain(); this.sfx.gain.value=1; this.sfx.connect(this.master);
    this.verb=this.ctx.createConvolver(); this.verb.buffer=this.makeIR(2.0,2.6);
    this.verbGain=this.ctx.createGain(); this.verbGain.gain.value=0.30;
    this.verb.connect(this.verbGain); this.verbGain.connect(this.master);
    this.noiseBuf=this.makeNoise(2.0);
    this.startAmbient();
  },
  makeIR(dur,decay){
    const sr=this.ctx.sampleRate, len=Math.floor(sr*dur);
    const buf=this.ctx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } }
    return buf;
  },
  makeNoise(dur){
    const sr=this.ctx.sampleRate, len=Math.floor(sr*dur);
    const buf=this.ctx.createBuffer(1,len,sr); const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return buf;
  },
  noiseSrc(){ const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; return s; },
  burst(o){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+(o.when||0);
    const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf;
    src.playbackRate.value=o.rate||1;
    const f=this.ctx.createBiquadFilter(); f.type=o.type||'bandpass';
    f.frequency.setValueAtTime(o.f0||1000,t);
    if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f1),t+(o.dur||0.2));
    f.Q.value=o.q||1;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,o.gain||0.4),t+(o.atk||0.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.2));
    src.connect(f); f.connect(g); g.connect(this.sfx);
    if(o.verb) { const v=this.ctx.createGain(); v.gain.value=o.verb; g.connect(v); v.connect(this.verb); }
    src.start(t); src.stop(t+(o.dur||0.2)+0.05);
  },
  tone(o){
    if(!this.ctx) return;
    const t=this.ctx.currentTime+(o.when||0);
    const osc=this.ctx.createOscillator(); osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f0||220,t);
    if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+(o.dur||0.3));
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,o.gain||0.2),t+(o.atk||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.3));
    osc.connect(g); g.connect(this.sfx);
    if(o.verb){ const v=this.ctx.createGain(); v.gain.value=o.verb; g.connect(v); v.connect(this.verb); }
    osc.start(t); osc.stop(t+(o.dur||0.3)+0.05);
  },
  startAmbient(){
    if(!this.ctx||this.ambient) return;
    const src=this.noiseSrc();
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=340; f.Q.value=0.8;
    const g=this.ctx.createGain(); g.gain.value=0.10;
    const lfo=this.ctx.createOscillator(); lfo.frequency.value=0.06;
    const lg=this.ctx.createGain(); lg.gain.value=0.055;
    lfo.connect(lg); lg.connect(g.gain);
    const lfo2=this.ctx.createOscillator(); lfo2.frequency.value=0.021;
    const lg2=this.ctx.createGain(); lg2.gain.value=150;
    lfo2.connect(lg2); lg2.connect(f.frequency);
    src.connect(f); f.connect(g); g.connect(this.master);
    const vg=this.ctx.createGain(); vg.gain.value=0.25; g.connect(vg); vg.connect(this.verb);
    src.start(); lfo.start(); lfo2.start();
    this.ambient={g,f};
  },
  shot(id,vol){
    const v=(vol||1)*0.85;
    this.burst({type:'bandpass',f0:2600,f1:700,q:0.7,dur:0.16,gain:0.55*v,verb:0.5});
    this.burst({type:'highpass',f0:3200,dur:0.045,gain:0.5*v,verb:0.2});
    this.tone({type:'sine',f0:120,f1:44,dur:0.22,gain:0.55*v,verb:0.3});
    this.tone({type:'triangle',f0:900,f1:180,dur:0.09,gain:0.16*v});
    if(id==='shotgun'){ this.burst({type:'lowpass',f0:900,f1:180,dur:0.35,gain:0.5*v,verb:0.6}); }
  },
  dry(){ this.burst({type:'bandpass',f0:2400,q:3,dur:0.05,gain:0.25}); },
  deny(){ this.tone({type:'square',f0:180,f1:120,dur:0.12,gain:0.12}); },
  reload(id){
    const seq=id==='shotgun'
      ? [[0,0.05],[0.5,0.09],[0.62,0.12],[1.15,0.09],[1.35,0.14],[2.1,0.12]]
      : [[0,0.06],[0.42,0.10],[0.92,0.08],[1.5,0.14],[1.85,0.07],[2.2,0.05]];
    for(const [w,d] of seq) this.burst({type:'bandpass',f0:1800+Math.random()*1600,q:2.5,dur:d,gain:0.28,when:w,verb:0.15});
    this.tone({type:'triangle',f0:320,f1:180,dur:0.09,gain:0.14,when:0.9});
  },
  magOut(){ this.burst({type:'bandpass',f0:2700,q:4,dur:0.045,gain:0.22});
    this.tone({type:'square',f0:540,f1:320,dur:0.045,gain:0.07}); },
  magIn(){ this.burst({type:'bandpass',f0:1250,q:2.2,dur:0.075,gain:0.26,verb:0.2});
    this.tone({type:'sine',f0:190,f1:95,dur:0.09,gain:0.13}); },
  magDrop(){ this.burst({type:'lowpass',f0:700,q:1.2,dur:0.13,gain:0.22,verb:0.3});
    this.tone({type:'triangle',f0:150,f1:70,dur:0.10,gain:0.10}); },
  bolt(){ this.burst({type:'highpass',f0:2100,dur:0.075,gain:0.26});
    this.tone({type:'triangle',f0:430,f1:210,dur:0.09,gain:0.10}); },
  pump(){ this.burst({type:'bandpass',f0:1500,q:2,dur:0.09,gain:0.24,verb:0.2}); },
  build(){ this.burst({type:'bandpass',f0:1200,q:2,dur:0.1,gain:0.3,verb:0.2}); this.tone({type:'square',f0:420,f1:260,dur:0.08,gain:0.1}); },
  swap(){ this.burst({type:'bandpass',f0:2200,q:3,dur:0.05,gain:0.2}); },
  step(kind){
    const f=kind==='run'?220:300;
    this.burst({type:'lowpass',f0:f,q:1,dur:kind==='run'?0.10:0.08,gain:kind==='run'?0.20:0.13,verb:0.12});
    this.burst({type:'bandpass',f0:1400,q:2,dur:0.05,gain:0.06});
  },

/* ------------------------------- HUD -------------------------------- */
function updateVitals(){
  el.hpTxt.textContent=Math.max(0,Math.round(P.hp));
  el.hpFill.style.width=clamp(P.hp/P.maxhp*100,0,100)+'%';
  el.spFill.style.width=clamp(P.stamina,0,100)+'%';
  el.scrapTxt.textContent=P.scrap;
}
let dmgDirEls=[];
function showDamageDir(from){
  const ang=Math.atan2(from.x-P.pos.x, -(from.z-P.pos.z));
  const rel=ang-P.yaw;
  const d=document.createElement('div'); d.className='ddir';
  d.style.transform=`rotate(${rel}rad)`;
  d.style.opacity='1';
  el.dmgdirs.appendChild(d); dmgDirEls.push(d);
  setTimeout(()=>{ d.style.transition='opacity .4s'; d.style.opacity='0'; setTimeout(()=>d.remove(),420); },700);
  if(dmgDirEls.length>6){ const o=dmgDirEls.shift(); if(o&&o.parentNode)o.remove(); }
}
function drawRadar(){
  const c=el.radar, ctx=c.getContext('2d');
  const W=c.width,H=c.height,cx=W/2,cy=H/2,R=W/2-8;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.clip();
  ctx.fillStyle='rgba(5,10,9,.42)'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=2;
  for(let i=1;i<=3;i++){ ctx.beginPath(); ctx.arc(cx,cy,R*i/3,0,6.283); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx-R,cy); ctx.lineTo(cx+R,cy); ctx.moveTo(cx,cy-R); ctx.lineTo(cx,cy+R); ctx.stroke();
  const scale=R/42;
  for(const z of GAME.zombies){
    const dx=(z.root.position.x-P.pos.x)*scale, dz=(z.root.position.z-P.pos.z)*scale;
    if(Math.hypot(dx,dz)>R) continue;
    ctx.fillStyle=z.type==='brute'?'#ff6a4a':(z.type==='runner'?'#ffb45a':'#9fe07a');
    ctx.beginPath(); ctx.arc(cx+dx,cy+dz,z.type==='brute'?8:5.5,0,6.283); ctx.fill();
  }
  for(const d of DOORS){ if(d.panels.length===0) continue;
    const dx=(d.x-P.pos.x)*scale, dz=(d.z-P.pos.z)*scale;
    if(Math.hypot(dx,dz)>R) continue;
    ctx.strokeStyle='rgba(255,120,60,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx+dx,cy+dz,7,0,6.283); ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(-P.yaw);
  ctx.fillStyle='#ffb45a'; ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(8,9); ctx.lineTo(0,4.5); ctx.lineTo(-8,9);
  ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.stroke();
}
function updateCrosshair(){
  const w=currentW();
  const spread=4+w.ads*0+w.def.spread*(1-w.ads)*(1+Math.min(P.speed,8)*0.05)+w.mag*0;
  const gap=clamp(spread,4,34);
  const ch=el.crosshair;
  ch.children[0].style.transform=`translateY(${-gap}px)`;
  ch.children[1].style.transform=`translateY(${gap}px)`;
  ch.children[2].style.transform=`translateX(${-gap}px)`;
  ch.children[3].style.transform=`translateX(${gap}px)`;
  ch.style.opacity= w.ads>0.24?0:1;
}

/* -------------------------- player damage --------------------------- */
function hurtPlayer(amount,fromPos){
  if(P.dead||GAME.state!=='playing') return;
  if(window.__DD&&window.__DD.test) return;
  P.hp-=amount; P.damageFlash=Math.min(1,P.damageFlash+0.6); P.hurtT=1;
  Audio.hurt(); showDamageDir(fromPos);
  if(P.hp<=0){ P.hp=0; die(); }
}
function die(){
  P.dead=true; P.deathT=0; GAME.state='dying';
  Audio.zombieDie({T:{type:'walker'}});
  setTimeout(()=>{ endGame(false); },2200);
}

function resetGame(){
  for(const z of GAME.zombies){ scene.remove(z.root); }
  GAME.zombies.length=0;
  for(const c of GAME.corpses){ scene.remove(c.root); }
  GAME.corpses.length=0;
  for(const p of GAME.pickups){ scene.remove(p.mesh); scene.remove(p.spr); }
  GAME.pickups.length=0;
  for(const d of decalPool){ d.active=false; d.mesh.visible=false; }
  for(const b of bloodPool){ b.active=false; b.mesh.visible=false; }
  P.pos.set(3.6,0,-8.4); P.vel.set(0,0,0); P.yaw=Math.PI; P.pitch=-0.04;
  P.hp=P.maxhp; P.stamina=100; P.scrap=0; P.kills=0; P.dead=false; P.deathT=0;
  P.damageFlash=0; P.recoil=0; P.recoilV=0;
  GAME.wave=0; GAME.waveActive=false; GAME.intermission=0; GAME.spawnQueue=[];
  GAME.kills=0; GAME.score=0; GAME.time=0; GAME.shotsFired=0; GAME.headshots=0; GAME.ended=false;
  for(const w of WEAPONS){ w.mag=w.def.mag; w.res=Math.round(w.def.maxRes*0.6); w.reloading=false; w.reloadT=0; w.ads=0; w.adsT=0; }

  createPickup('shell',-1.0,-9.5); createPickup('med',7.5,-9.6);
  createPickup('scrap',-6.5,4.0); createPickup('scrap',-11.0,6.5);
  createPickup('scrap',10.5,3.0); createPickup('med',-9.0,1.5);
  createPickup('ammo',13.0,8.0); createPickup('shell',-14.0,9.0);
  updateAmmoHUD(); updateVitals();
}
function startGame(){
  Audio.init();
  resetGame();
  GAME.state='playing';
  showScreen(null); el.hud.classList.add('on');

    P.pos.set(0.5,0,6.0); P.yaw=0; P.pitch=-0.02;

     ['spitter',6.6,-1.0],['crawler',1.6,3.4]].forEach(([ty,x,z])=>{

/* ---------------------------- main loop ------------------------------ */
let lastT=performance.now();
let fpsAcc=0,fpsN=0;
function update(dt){
  GAME.time+=dt;
  updatePlayer(dt);
  updateWeapons(dt);
  // navigation field for the infected (recomputed a few times a second)
  NAV.acc+=dt;
  if(NAV.acc>0.22){ NAV.acc=0; navField(); }
  // zombies
  for(let i=GAME.zombies.length-1;i>=0;i--){
    const z=GAME.zombies[i]; z.update(dt);
  }
  // corpses fade
  for(let i=GAME.corpses.length-1;i>=0;i--){
    const c=GAME.corpses[i]; c.deathT+=0; c.update(dt);
    if(c.deathT>13){ scene.remove(c.root); GAME.corpses.splice(i,1); }
  }
  updatePickups(dt);
  updateWaves(dt);
  updateInteraction();
  updateVitals();
  updateAmmoHUD();
  updateCrosshair();
  drawRadar();
  // particles
  if(PAR) PAR.update(dt);
  // tracers
  for(const tr of tracerPool){
    if(!tr.active) continue;
    tr.t-=dt; tr.mesh.material.opacity=Math.max(0,tr.t/0.055)*0.85;
    if(tr.t<=0){ tr.active=false; tr.mesh.visible=false; }
  }
  // decals
  for(const d of decalPool){ if(!d.active) continue; d.t-=dt; if(d.t<=0){d.active=false;d.mesh.visible=false;} }
  for(const b of bloodPool){ if(!b.active) continue; b.t-=dt; if(b.t<=0){b.active=false;b.mesh.visible=false;} }
  // acid projectiles
  for(const a of acidPool){
    if(!a.active) continue;
    a.life-=dt; a.vel.y-=3.2*dt;
    a.mesh.position.addScaledVector(a.vel,dt);
    if(a.life<=0||a.mesh.position.y<0.05){
      a.active=false; a.mesh.visible=false;
      if(a.mesh.position.y<0.2){
        for(let k=0;k<8;k++) if(PAR) PAR.spawn(a.mesh.position.x,0.2,a.mesh.position.z,
          rnd(-1.5,1.5),rnd(.5,2.5),rnd(-1.5,1.5),.5,.09,.35,.55,.1,7);
      }
      continue;
    }
    const d=Math.hypot(a.mesh.position.x-P.pos.x,a.mesh.position.y-P.pos.y-1.2,a.mesh.position.z-P.pos.z);
    if(d<0.9){ a.active=false; a.mesh.visible=false; hurtPlayer(14,a.mesh.position); }
  }
  // heartbeat at low health
  if(P.hp<40&&!P.dead){ Audio.heartT-=dt; if(Audio.heartT<=0){ Audio.heartT=1.15; Audio.heartbeat(); } }
  // lamp flicker
  for(const l of LAMP_LIGHTS){
    l.phase+=dt*l.speed;
    let f=l.broken? (Math.random()<0.06?0.15+Math.random()*0.5:0.02) : 1;
    l.light.intensity=l.base*f*(0.92+Math.sin(l.phase)*0.06+Math.sin(l.phase*3.3)*0.03);
  }
  MOUSE.rawx*=0.86; MOUSE.rawy*=0.86;
}
function render(dt){
  PostFX.damage=Math.min(1,P.damageFlash*0.8);
  PostFX.ca=lerp(0,0.0025,P.damageFlash);
  PostFX.render(dt);
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>0.1) dt=0.1;
  if(GAME.state==='playing'||GAME.state==='dying') update(dt);
  else {
    // idle camera drift in menus
    const t=now*0.00016;
    if(window.__DD&&window.__DD.photo){
      const shot=parseInt(window.__DD.shot||'0',10);
      const POSE=[
        [[42,9.5,30],[1,1.5,-4]],          // 0 outside compound
        [[3.6,2.4,5.0],[3.6,1.4,-4.0]],    // 1 yard -> HQ south door
        [[3.6,1.7,-8.4],[3.6,1.5,10]],     // 2 inside HQ -> out the door
        [[0.5,2.2,-6.0],[0,-1.5,-14]],     // 3 yard -> north gate
        [[-9,2.0,4.5],[-9,1.4,10]],        // 4 barracks door
        [[16,6.5,16],[6,2,-2]]             // 5 tower view
      ][shot]||[[42,9.5,30],[1,1.5,-4]];
      camera.position.set(POSE[0][0]+Math.cos(t*0.5)*0.6,POSE[0][1]+Math.sin(t*1.3)*0.2,POSE[0][2]+Math.sin(t*0.5)*0.6);
      camera.lookAt(POSE[1][0],POSE[1][1],POSE[1][2]);
    }else{
      camera.position.set(Math.cos(t)*24,4.6+Math.sin(t*1.7)*0.7,Math.sin(t)*24);
      camera.lookAt(0,2.4,0);
    }
    WEAPONS.forEach(w=>w.mesh.visible=false);
    flashSprite.visible=false;
    for(const l of LAMP_LIGHTS){ l.phase+=dt*l.speed;
      let f=l.broken?(Math.random()<0.06?0.15+Math.random()*0.5:0.02):1;
      l.light.intensity=l.base*f*(0.92+Math.sin(l.phase)*0.06); }
  }
  render(dt);
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>=0.25){
    const st=PostFX.stats||{calls:0,tris:0};
    el.debug.textContent='FPS '+(fpsN/fpsAcc).toFixed(0)+'  ·  calls '+st.calls+'  ·  tris '+(st.tris/1000).toFixed(1)+'k';
    fpsAcc=0; fpsN=0;
  }
}

  el.loadBar.querySelector('i').style.width=pct+'%';
  el.loadTxt.textContent=pct+'%';
  if(txt) el.loadTxt.textContent=txt;

function initSteps(){
  const steps=[
    [12,()=>{ buildTextures(); }],
    [46,()=>{ buildMaterials(); }],
    [62,()=>{ buildWorld(); }],
    [82,()=>{ ensureZMats(); ensurePMats(); }],
    [92,()=>{ initWeapons(); PAR=new Particles(900); }],
    [100,()=>{ applyQuality(); PostFX.strength=SET.bloom/100; resetGame();
      if(window.__DD&&window.__DD.test){
        const d=DIFF[SET.diff]||DIFF[0];
        [['walker',-2.6,1.2],['walker',0.8,0.6],['runner',3.6,1.6],['brute',-5.4,-0.4],
         ['spitter',6.6,-1.0],['crawler',1.6,3.4]].forEach(([ty,x,z])=>{
          const zz=new Zombie(ty,x,z,d.hp,d.dmg,d.spd);
          zz.frozen=true; zz.aimYaw=0; zz.root.rotation.y=Math.PI;
          GAME.zombies.push(zz);
        });
      }
    }]
  ];
  let i=0;
  function next(){
    if(i>=steps.length){
      setLoad(100,'');
      applyI18n(); syncSettingsUI();
      if(window.__DD&&window.__DD.photo){ showScreen(null); el.hud.classList.remove('on'); }
      else showScreen('scMenu');
      GAME.state='menu';
      requestAnimationFrame(frame);
      return;
    }
    const [pct,fn]=steps[i++];
    setLoad(pct);
    setTimeout(()=>{ try{ fn(); }catch(err){ console.error(err); } next(); },16);
  }
  next();
}
applyI18n();
syncSettingsUI();
/* URL options: ?debug=1&post=0&q=low&auto=1  (diagnostics) */
(function(){
  const q=new URLSearchParams(location.search);
  if(q.has('lang')&&(q.get('lang')==='zh'||q.get('lang')==='en')){ SET.lang=q.get('lang'); LANG=SET.lang; saveSet(); }
  if(q.has('q')&&QUALITY[q.get('q')]){ SET.qual=q.get('q'); }
  if(q.get('post')==='0'){ PostFX.on=false; }
  if(q.get('debug')==='1'){ el.debug.classList.add('on'); }
  window.__DD={q:q,photo:q.get('photo')==='1',shot:q.get('shot')||'0',test:q.get('test')==='1'};
})();
initSteps();

/*__END__*/
</script>
